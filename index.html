/* =====================================================
   UTILITY
===================================================== */

function toast(message) {

  const el = document.getElementById("toast");

  el.innerText = message;

  el.style.display = "block";

  setTimeout(() => {

    el.style.display = "none";

  }, 3000);

}


function uid() {

  if (!auth.currentUser) {

    throw new Error("User not logged in");

  }

  return auth.currentUser.uid;

}


function userCollection(name) {

  return collection(
    db,
    "users",
    uid(),
    name
  );

}


function userDoc(name, id) {

  return doc(
    db,
    "users",
    uid(),
    name,
    String(id)
  );

}


function newId() {

  return Date.now().toString();

}

   LOGIN / SIGNUP SCREEN
===================================================== */

/* =====================================================
   CREATE ACCOUNT
===================================================== */

window.createAccount = async function () {

  const name =
    document.getElementById("signupName").value.trim();

  const email =
    document.getElementById("signupEmail").value.trim();

  const password =
    document.getElementById("signupPassword").value;


  if (!name) {

    toast("আপনার নাম দিন");

    return;

  }


  if (!email) {

    toast("Email দিন");

    return;

  }


  if (!password) {

    toast("Password দিন");

    return;

  }


  if (password.length < 6) {

    toast("Password কমপক্ষে 6 অক্ষরের হতে হবে");

    return;

  }


  try {

    const result =
      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );


    /* User Name */

    await updateProfile(
      result.user,
      {
        displayName: name
      }
    );


    /* User Main Document */

    await setDoc(
      doc(
        db,
        "users",
        result.user.uid
      ),
      {
        name: name,
        email: email,
        createdAt: new Date().toISOString()
      }
    );


    /* Default Settings */

    await setDoc(
      doc(
        db,
        "users",
        result.user.uid,
        "settings",
        "main"
      ),
      {
        storeName: "Smart Store"
      }
    );


    /* Verification Email */

    try {

      await sendEmailVerification(result.user);

    } catch (verificationError) {

      console.log(
        "Verification email error:",
        verificationError
      );

    }


    /* Clear Form */

    document.getElementById("signupName").value = "";

    document.getElementById("signupEmail").value = "";

    document.getElementById("signupPassword").value = "";


    toast(
      "Account সফলভাবে তৈরি হয়েছে। Verification Email পাঠানো হয়েছে।"
    );


  } catch (error) {

    console.error(error);

    let message = "Account তৈরি করা যায়নি।";


    switch (error.code) {

      case "auth/email-already-in-use":

        message =
          "এই Email দিয়ে আগে থেকেই Account আছে।";

        break;


      case "auth/invalid-email":

        message =
          "সঠিক Email Address দিন।";

        break;


      case "auth/weak-password":

        message =
          "Password আরও শক্তিশালী দিন।";

        break;


      case "auth/network-request-failed":

        message =
          "Internet connection পরীক্ষা করুন।";

        break;


      case "auth/too-many-requests":

        message =
          "অনেকবার চেষ্টা করা হয়েছে। কিছুক্ষণ পর আবার চেষ্টা করুন।";

        break;


      default:

        message =
          error.message;

    }


    toast(message);

  }

};


/* =====================================================
   LOGIN
===================================================== */

window.loginAccount = async function () {

  const password =

  if (!email || !password) {

    return;

  }


  try {

    await signInWithEmailAndPassword(
      auth,
      email,
      password

    toast("Login successful");


  } catch (error) {

    console.error(error);

    let message = "Login করা যায়নি।";


    switch (error.code) {

      case "auth/invalid-credential":

        message =
          "Email অথবা Password ভুল।";

        break;


      case "auth/user-not-found":

        message =
          "এই Email দিয়ে কোনো Account নেই।";

        break;


      case "auth/wrong-password":

        message =
          "Password ভুল।";

        break;


      case "auth/invalid-email":

        message =
          "Email সঠিক নয়।";

        break;


      case "auth/too-many-requests":

        message =
          "অনেকবার চেষ্টা করা হয়েছে। পরে আবার চেষ্টা করুন।";

        break;


      default:

        message =
          error.message;

    }


    toast(message);

  }

};

/* =====================================================
   AUTH STATE
===================================================== */

onAuthStateChanged(
  auth,
  async user => {

    if (user) {

      document
        .getElementById("loginScreen")
        .classList.add("hidden");

      document
        .getElementById("signupScreen")
        .classList.add("hidden");

      document
        .getElementById("app")
        .style.display = "block";


      document
        .getElementById("userEmail")
        .innerText =
        user.email || "";


      document
        .getElementById("accountInfo")
        .innerText =
        `${user.displayName || "User"} | ${user.email}`;


      try {

        await loadAll();

        showPage("dashboard");

      } catch (error) {

        console.error(error);

        toast(
          "Data load করা যায়নি: " +
          error.message
        );

      }

    } else {

      document
        .getElementById("app")
        .style.display = "none";


      document
        .getElementById("signupScreen")
        .classList.add("hidden");


      document
        .getElementById("loginScreen")
        .classList.remove("hidden");

    }

  }
);


/* =====================================================
   LOAD COLLECTION
===================================================== */

async function loadCollection(name) {

  const snapshot =
    await getDocs(
      userCollection(name)
    );


  return snapshot.docs.map(
    d => d.data()
  );

}


/* =====================================================
   LOAD ALL DATA
===================================================== */

async function loadAll() {

  products =
    await loadCollection("products");

  sales =
    await loadCollection("sales");

  purchases =
    await loadCollection("purchases");

  expenses =
    await loadCollection("expenses");

  duePayments =
    await loadCollection("duePayments");


  const settingsSnap =
    await getDoc(
      doc(
        db,
        "users",
        uid(),
        "settings",
        "main"
      )
    );


  if (settingsSnap.exists()) {

    settings =
      settingsSnap.data();

  } else {

    settings = {
      storeName: "Smart Store"
    };

    await setDoc(
      doc(
        db,
        "users",
        uid(),
        "settings",
        "main"
      ),
      settings
    );

  }


  document
    .getElementById("storeName")
    .value =
    settings.storeName || "Smart Store";


  document
    .getElementById("headerStore")
    .innerText =
    settings.storeName || "Smart Store";


  renderAll();

}


/* =====================================================
   SAVE / DELETE
===================================================== */

async function saveItem(
  collectionName,
  item
) {

  await setDoc(
    userDoc(
      collectionName,
      item.id
    ),
    item
  );

}


async function removeItem(
  collectionName,
  id
) {

  await deleteDoc(
    userDoc(
      collectionName,
      id
    )
  );

}


/* =====================================================
   PRODUCT
===================================================== */

window.addProduct = async function () {

  try {

    const name =
      document
        .getElementById("productName")
        .value
        .trim();

    const barcode =
      document
        .getElementById("productBarcode")
        .value
        .trim();

    const purchase =
      Number(
        document
          .getElementById("productPurchase")
          .value
      );

    const sale =
      Number(
        document
          .getElementById("productSale")
          .value
      );

    const stock =
      Number(
        document
          .getElementById("productStock")
          .value
      );


    if (!name) {

      toast("Product Name দিন");

      return;

    }


    const item = {

      id: newId(),

      name,

      barcode,

      purchase,

      sale,

      stock,

      createdAt:
        new Date().toISOString()

    };


    await saveItem(
      "products",
      item
    );


    products.push(item);


    document.getElementById(
      "productName"
    ).value = "";

    document.getElementById(
      "productBarcode"
    ).value = "";

    document.getElementById(
      "productPurchase"
    ).value = "";

    document.getElementById(
      "productSale"
    ).value = "";

    document.getElementById(
      "productStock"
    ).value = "";


    renderAll();

    toast("Product added successfully");

  } catch (error) {

    console.error(error);

    toast(error.message);

  }

};


window.deleteProduct = async function (id) {

  if (
    !confirm(
      "Product delete করবেন?"
    )
  ) return;


  try {

    await removeItem(
      "products",
      id
    );


    products =
      products.filter(
        x =>
          String(x.id) !==
          String(id)
      );


    renderAll();

    toast("Product deleted");

  } catch (error) {

    toast(error.message);

  }

};


/* =====================================================
   SALES
===================================================== */

window.addSale = async function () {

  try {

    const productId =
      document
        .getElementById("saleProduct")
        .value;

    const qty =
      Number(
        document
          .getElementById("saleQty")
          .value
      );

    const customer =
      document
        .getElementById("saleCustomer")
        .value
        .trim();

    const paid =
      Number(
        document
          .getElementById("salePaid")
          .value
      );


    const product =
      products.find(
        x =>
          String(x.id) ===
          String(productId)
      );


    if (!product) {

      toast("Product select করুন");

      return;

    }


    if (qty <= 0) {

      toast("Quantity সঠিক দিন");

      return;

    }


    if (product.stock < qty) {

      toast("পর্যাপ্ত stock নেই");

      return;

    }


    const total =
      Number(product.sale) * qty;


    if (paid < 0 || paid > total) {

      toast(
        "Paid amount সঠিক নয়"
      );

      return;

    }


    const due =
      Math.max(
        0,
        total - paid
      );


    const item = {

      id: newId(),

      productId: product.id,

      productName: product.name,

      customer,

      qty,

      total,

      paid,

      due,

      date:
        new Date().toISOString()

    };


    await saveItem(
      "sales",
      item
    );


    sales.push(item);


    product.stock -= qty;


    await saveItem(
      "products",
      product
    );


    if (due > 0) {

      const dueItem = {

        id: newId(),

        customer:
          customer || "Unknown",

        amount: due,

        saleId: item.id,

        date:
          new Date().toISOString()

      };


      await saveItem(
        "duePayments",
        dueItem
      );


      duePayments.push(
        dueItem
      );

    }


    renderAll();

    toast("Sale saved");

  } catch (error) {

    console.error(error);

    toast(error.message);

  }

};

===================================================== */

function renderAll() {

  renderSales();

  renderDue();

  updateSelects();

  updateDashboard();

}


function money(n) {

  return "৳" +
    Number(n || 0)
      .toLocaleString("en-BD");

}


function dateFormat(d) {

  if (!d) return "";

  return new Date(d)
    .toLocaleDateString("bn-BD");

}


/* =====================================================
   PRODUCTS RENDER
===================================================== */

function renderProducts() {

  const tbody =
    document.getElementById(
      "productsTable"
    );


  tbody.innerHTML = "";


  products.forEach(p => {

    tbody.innerHTML += `

      <tr>

        <td>
          ${escapeHtml(p.name)}
        </td>

        <td>
          ${escapeHtml(p.barcode || "")}
        </td>

        <td>
          ${money(p.purchase)}
        </td>

        <td>
          ${money(p.sale)}
        </td>

        <td>
          ${p.stock}
        </td>

        <td>

          <button
            class="danger"
            onclick="deleteProduct('${p.id}')">

            Delete

          </button>

        </td>

      </tr>

    `;

  });

}

          </td>

          <td>
            ${escapeHtml(e.name)}
          </td>

          <td>
            ${money(e.amount)}
          </td>

          <td>

            <button
              class="danger"
              onclick="deleteExpense('${e.id}')">

              Delete

            </button>

          </td>

        </tr>

      `;

    });

}


/* =====================================================
   PRODUCT SELECT
===================================================== */

function updateSelects() {

  const sale =
    document.getElementById(
      "saleProduct"
    );

  const purchase =
    document.getElementById(
      "purchaseProduct"
    );


  if (!sale || !purchase) return;


  const html =
    products
      .map(
        p => `

          <option value="${p.id}">

            ${escapeHtml(p.name)}
            - Stock: ${p.stock}

          </option>

        `
      )
      .join("");


  sale.innerHTML = html;

  purchase.innerHTML = html;

}


/* =====================================================
   DASHBOARD
===================================================== */

function updateDashboard() {

  const totalSales =
    sales.reduce(
      (a, b) =>
        a + Number(b.total || 0),
      0
    );


  const totalPurchase =
    purchases.reduce(
      (a, b) =>
        a + Number(b.total || 0),
      0
    );


  const totalExpense =
    expenses.reduce(
      (a, b) =>
        a + Number(b.amount || 0),
      0
    );


  const totalDue =
    duePayments.reduce(
      (a, b) =>
        a + Number(b.amount || 0),
      0
    );


  document.getElementById(
    "totalSales"
  ).innerText =
    money(totalSales);


  document.getElementById(
    "totalPurchase"
  ).innerText =
    money(totalPurchase);


  document.getElementById(
    "totalExpense"
  ).innerText =
    money(totalExpense);


  document.getElementById(
    "totalDue"
  ).innerText =
    money(totalDue);


  document.getElementById(
    "totalProducts"
  ).innerText =
    products.length;


  document.getElementById(
    "reportSales"
  ).innerText =
    money(totalSales);


  document.getElementById(
    "reportPurchase"
  ).innerText =
    money(totalPurchase);


  document.getElementById(
    "reportExpense"
  ).innerText =
    money(totalExpense);


  document.getElementById(
    "reportDue"
  ).innerText =
    money(totalDue);


  const profit =
    totalSales -
    totalPurchase -
    totalExpense;


  document.getElementById(
    "reportProfit"
  ).innerText =
    money(profit);

}


/* =====================================================
   PAGES
===================================================== */

window.showPage = function (page) {

  document
    .querySelectorAll(
      "main > section"
    )
    .forEach(
      x =>
        x.classList.add("hidden")
    );


  const target =
    document.getElementById(
      "page-" + page
    );


  if (target) {

    target.classList.remove(
      "hidden"
    );

  }


  document
    .querySelectorAll(
      "nav button"
    )
    .forEach(
      x =>
        x.classList.remove(
          "active"
        )
    );


  const nav =
    document.getElementById(
      "nav-" + page
    );


  if (nav) {

    nav.classList.add(
      "active"
    );

  }

};

/* =====================================================
   ACCOUNT DELETE
===================================================== */

window.deleteAccount = async function () {

  if (
    !confirm(
      "Account permanently delete করবেন?\n\nসব Products, Sales, Purchase, Due ও Expense মুছে যাবে।"
    )
  ) return;


  try {

    const currentUser =
      auth.currentUser;

    const uidValue =
      currentUser.uid;


    const collections = [

      "products",
      "sales",
      "purchases",
      "expenses",
      "duePayments"

    ];


    for (
      const collectionName
      of collections
    ) {

      const snap =
        await getDocs(
          collection(
            db,
            "users",
            uidValue,
            collectionName
          )
        );


      for (
        const item
        of snap.docs
      ) {

        await deleteDoc(
          item.ref
        );

      }

    }


    /* Delete settings */

    await deleteDoc(
      doc(
        db,
        "users",
        uidValue,
        "settings",
        "main"
      )
    ).catch(() => {});


    /* Delete user profile */

    await deleteDoc(
      doc(
        db,
        "users",
        uidValue
      )
    );


    /* Delete Firebase Auth Account */

    await deleteUser(
      currentUser
    );


    toast(
      "Account permanently deleted"
    );


  } catch (error) {

    console.error(error);

    toast(
      "Account delete করতে আবার Login করতে হতে পারে: " +
      error.message
    );

  }

};


/* =====================================================
   BACKUP
===================================================== */

window.downloadBackup = function () {

  const data = {

    settings,

    products,

    sales,

    purchases,

    expenses,

    duePayments

  };


  const blob =
    new Blob(
      [
        JSON.stringify(
          data,
          null,
          2
        )
      ],
      {
        type:
          "application/json"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      "a"
    );


  a.href = url;


  a.download =
    "smart-store-backup-" +
    Date.now() +
    ".json";


  document.body.appendChild(a);

  a.click();

  a.remove();


  URL.revokeObjectURL(
    url
  );


  toast(
    "Backup downloaded"
  );

};


/* =====================================================
   RESTORE
===================================================== */

window.restoreBackup = async function (event) {

  const file =
    event.target.files[0];


  if (!file) return;


  if (
    !confirm(
      "Restore করলে বর্তমান data replace হবে। Continue?"
    )
  ) {

    event.target.value = "";

    return;

  }


  try {

    const text =
      await file.text();


    const data =
      JSON.parse(text);


    const collections = [

      "products",
      "sales",
      "purchases",
      "expenses",
      "duePayments"

    ];


    /* Delete Existing Data */

    for (
      const collectionName
      of collections
    ) {

      const snap =
        await getDocs(
          collection(
            db,
            "users",
            uid(),
            collectionName
          )
        );


      for (
        const item
        of snap.docs
      ) {

        await deleteDoc(
          item.ref
        );

      }

    }


    /* Restore */

    for (
      const collectionName
      of collections
    ) {

      const items =
        data[
          collectionName
        ] || [];


      for (
        const item
        of items
      ) {

        if (!item.id) continue;


        await saveItem(
          collectionName,
          item
        );

      }

    }


    /* Restore Settings */

    if (data.settings) {

      settings =
        data.settings;


      await setDoc(
        doc(
          db,
          "users",
          uid(),
          "settings",
          "main"
        ),
        settings
      );

    }


    await loadAll();


    event.target.value = "";


    toast(
      "Backup restored successfully"
    );


  } catch (error) {

    console.error(error);

    toast(
      "Backup restore failed: " +
      error.message
    );

  }

};


/* =====================================================
   HTML SECURITY
===================================================== */

function escapeHtml(value) {

  return String(
    value ?? ""
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}
