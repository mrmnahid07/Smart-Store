<script>
"use strict";

const DB_KEY = "smartStoreDB";

const $ = id => document.getElementById(id);

function defaultDB(){
    return {
        products: [],
        sales: [],
        purchases: [],
        customers: [],
        expenses: []
    };
}

function loadDB(){
    try{
        const saved = localStorage.getItem(DB_KEY);
        if(!saved) return defaultDB();

        const data = JSON.parse(saved);

        return {
            products: Array.isArray(data.products) ? data.products : [],
            sales: Array.isArray(data.sales) ? data.sales : [],
            purchases: Array.isArray(data.purchases) ? data.purchases : [],
            customers: Array.isArray(data.customers) ? data.customers : [],
            expenses: Array.isArray(data.expenses) ? data.expenses : []
        };
    }catch(e){
        console.error(e);
        return defaultDB();
    }
}

let db = loadDB();

function save(){
    try{
        localStorage.setItem(DB_KEY, JSON.stringify(db));
        renderAll();
    }catch(e){
        alert("Data save করা যাচ্ছে না!");
        console.error(e);
    }
}

function today(){
    const d = new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

function money(v){
    return "৳"+Number(v||0).toLocaleString("en-BD",{
        minimumFractionDigits:2,
        maximumFractionDigits:2
    });
}

function escapeHTML(v){
    return String(v ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

/* =========================
   PAGE SYSTEM
========================= */

function showPage(page,button){

    document.querySelectorAll(".page").forEach(p=>{
        p.classList.remove("active");
    });

    const target=$(page);
    if(target) target.classList.add("active");

    document.querySelectorAll(".menu button").forEach(b=>{
        b.classList.remove("active");
    });

    if(button) button.classList.add("active");

    const titles={
        dashboard:"🏠 Dashboard",
        products:"📦 Products",
        sales:"🛒 Sales",
        purchase:"🚚 Purchase",
        customers:"👥 Customers",
        expenses:"💸 Expenses",
        reports:"📊 Reports"
    };

    if($("pageTitle"))
        $("pageTitle").innerText=titles[page]||"Smart Store";
}

/* =========================
   LOGOUT
========================= */

function logout(){

    if(confirm("আপনি কি Logout করতে চান?")){

        localStorage.removeItem("smartStoreLoggedIn");

        location.reload();
    }
}

/* =========================
   PRODUCT
========================= */

function findProduct(name){
    const n=String(name||"").trim().toLowerCase();

    return db.products.find(p=>
        String(p.name||"").trim().toLowerCase()===n
    );
}

function resetProductForm(){

    $("productForm")?.reset();

    if($("productId")) $("productId").value="";

    if($("productSubmit"))
        $("productSubmit").innerText="➕ Add Product";
}

function saveProduct(e){

    e.preventDefault();

    const id=$("productId").value;
    const name=$("productName").value.trim();

    if(!name){
        alert("Product Name লিখুন");
        return;
    }

    const product={
        id:id||Date.now().toString(),
        name:name,
        code:$("productCode").value.trim(),
        buy:Number($("productBuy").value||0),
        sell:Number($("productSell").value||0),
        stock:Number($("productStock").value||0)
    };

    if(id){

        const i=db.products.findIndex(p=>p.id===id);

        if(i!==-1) db.products[i]=product;

    }else{
        db.products.push(product);
    }

    resetProductForm();
    save();

    alert("✅ Product Saved");
}

function editProduct(id){

    const p=db.products.find(x=>x.id===id);
    if(!p)return;

    $("productId").value=p.id;
    $("productName").value=p.name;
    $("productCode").value=p.code||"";
    $("productBuy").value=p.buy||0;
    $("productSell").value=p.sell||0;
    $("productStock").value=p.stock||0;

    $("productSubmit").innerText="💾 Update Product";

    showPage("products");
}

function deleteProduct(id){

    if(!confirm("Product Delete করবেন?"))return;

    db.products=db.products.filter(p=>p.id!==id);
    save();
}

/* =========================
   SALES
========================= */

function autoSalePrice(){

    const p=findProduct($("saleProduct").value);

    if(p){
        $("salePrice").value=p.sell;
        $("saleCost").value=p.buy;
    }

    calculateSale();
}

function calculateSale(){

    const qty=Number($("saleQty").value||0);
    const price=Number($("salePrice").value||0);
    const paid=Number($("salePaid").value||0);

    const total=qty*price;
    const due=Math.max(0,total-paid);

    $("saleTotal").value=total.toFixed(2);
    $("saleDue").value=due.toFixed(2);

    const p=findProduct($("saleProduct").value);

    if(p) $("saleCost").value=p.buy;
}

function resetSaleForm(){

    $("salesForm")?.reset();

    $("saleId").value="";
    $("saleDate").value=today();
    $("salePaid").value=0;
    $("saleTotal").value=0;
    $("saleDue").value=0;
    $("saleCost").value=0;

    $("saleSubmit").innerText="➕ Add Sale";
}

function saveSale(e){

    e.preventDefault();

    const id=$("saleId").value;
    const name=$("saleProduct").value.trim();
    const qty=Number($("saleQty").value||0);
    const price=Number($("salePrice").value||0);
    const paid=Number($("salePaid").value||0);

    const product=findProduct(name);

    if(!product){
        alert("❌ Product পাওয়া যায়নি");
        return;
    }

    if(qty<=0){
        alert("Quantity সঠিকভাবে লিখুন");
        return;
    }

    const total=qty*price;

    if(paid>total){
        alert("Paid বেশি হতে পারবে না");
        return;
    }

    /* Edit হলে পুরোনো stock ফেরত */
    if(id){

        const old=db.sales.find(s=>s.id===id);

        if(old){

            const oldProduct=findProduct(old.product);

            if(oldProduct)
                oldProduct.stock+=Number(old.qty||0);
        }
    }

    if(product.stock<qty){

        if(id){

            const old=db.sales.find(s=>s.id===id);

            if(old){

                const oldProduct=findProduct(old.product);

                if(oldProduct)
                    oldProduct.stock-=Number(old.qty||0);
            }
        }

        alert("❌ Stock পর্যাপ্ত নেই");
        return;
    }

    product.stock-=qty;

    const sale={
        id:id||Date.now().toString(),
        date:$("saleDate").value||today(),
        product:name,
        qty:qty,
        price:price,
        total:total,
        paid:paid,
        due:Math.max(0,total-paid),
        customer:$("saleCustomer").value.trim(),
        cost:qty*Number(product.buy||0)
    };

    if(id){

        const i=db.sales.findIndex(s=>s.id===id);

        if(i!==-1)db.sales[i]=sale;

    }else{
        db.sales.push(sale);
    }

    resetSaleForm();
    save();

    alert("✅ Sale Saved");
}

function editSale(id){

    const s=db.sales.find(x=>x.id===id);
    if(!s)return;

    $("saleId").value=s.id;
    $("saleDate").value=s.date;
    $("saleProduct").value=s.product;
    $("saleQty").value=s.qty;
    $("salePrice").value=s.price;
    $("saleCustomer").value=s.customer||"";
    $("salePaid").value=s.paid;
    $("saleTotal").value=s.total;
    $("saleDue").value=s.due;
    $("saleCost").value=s.cost;

    $("saleSubmit").innerText="💾 Update Sale";

    showPage("sales");
}

function deleteSale(id){

    if(!confirm("Sale Delete করবেন?"))return;

    const s=db.sales.find(x=>x.id===id);

    if(s){

        const p=findProduct(s.product);

        if(p)p.stock+=Number(s.qty||0);
    }

    db.sales=db.sales.filter(s=>s.id!==id);

    save();
}

/* =========================
   PURCHASE
========================= */

function autoPurchasePrice(){

    const p=findProduct($("purchaseProduct").value);

    if(p){

        $("purchasePrice").value=p.buy;
        $("purchaseSell").value=p.sell;
    }
}

function resetPurchaseForm(){

    $("purchaseForm")?.reset();

    $("purchaseId").value="";
    $("purchaseDate").value=today();

    $("purchaseSubmit").innerText="➕ Add Purchase";
}

function savePurchase(e){

    e.preventDefault();

    const id=$("purchaseId").value;
    const name=$("purchaseProduct").value.trim();
    const qty=Number($("purchaseQty").value||0);
    const price=Number($("purchasePrice").value||0);
    const sell=Number($("purchaseSell").value||0);

    if(!name){
        alert("Product Name লিখুন");
        return;
    }

    if(qty<=0){
        alert("Quantity সঠিকভাবে লিখুন");
        return;
    }

    if(id){

        const old=db.purchases.find(p=>p.id===id);

        if(old){

            const oldProduct=findProduct(old.product);

            if(oldProduct)
                oldProduct.stock-=Number(old.qty||0);
        }
    }

    let product=findProduct(name);

    if(product){

        product.stock+=qty;
        product.buy=price;

        if(sell>0)
            product.sell=sell;

    }else{

        product={
            id:Date.now().toString(),
            name:name,
            code:"",
            buy:price,
            sell:sell||price,
            stock:qty
        };

        db.products.push(product);
    }

    const purchase={
        id:id||Date.now().toString(),
        date:$("purchaseDate").value||today(),
        product:name,
        qty:qty,
        price:price,
        total:qty*price,
        supplier:$("purchaseSupplier").value.trim()
    };

    if(id){

        const i=db.purchases.findIndex(p=>p.id===id);

        if(i!==-1)db.purchases[i]=purchase;

    }else{
        db.purchases.push(purchase);
    }

    resetPurchaseForm();
    save();

    alert("✅ Purchase Saved");
}

function editPurchase(id){

    const p=db.purchases.find(x=>x.id===id);
    if(!p)return;

    $("purchaseId").value=p.id;
    $("purchaseDate").value=p.date;
    $("purchaseProduct").value=p.product;
    $("purchaseQty").value=p.qty;
    $("purchasePrice").value=p.price;
    $("purchaseSupplier").value=p.supplier||"";

    const product=findProduct(p.product);

    $("purchaseSell").value=product?product.sell:"";

    $("purchaseSubmit").innerText="💾 Update Purchase";

    showPage("purchase");
}

function deletePurchase(id){

    if(!confirm("Purchase Delete করবেন?"))return;

    const p=db.purchases.find(x=>x.id===id);

    if(p){

        const product=findProduct(p.product);

        if(product)
            product.stock=Math.max(
                0,
                Number(product.stock||0)-Number(p.qty||0)
            );
    }

    db.purchases=db.purchases.filter(p=>p.id!==id);

    save();
}

/* =========================
   RENDER
========================= */

function renderProducts(){

    if(!$("productTable"))return;

    let html="";

    if(!db.products.length){

        html=`<tr><td colspan="7" class="empty">কোনো Product নেই</td></tr>`;

    }else{

        db.products.forEach(p=>{

            html+=`
            <tr>
                <td>${escapeHTML(p.name)}</td>
                <td>${escapeHTML(p.code||"-")}</td>
                <td>${money(p.buy)}</td>
                <td>${money(p.sell)}</td>
                <td>${p.stock}</td>
                <td>${money(Number(p.stock)*Number(p.buy))}</td>
                <td>
                    <button class="btn btn-warning" onclick="editProduct('${p.id}')">Edit</button>
                    <button class="btn btn-danger" onclick="deleteProduct('${p.id}')">Delete</button>
                </td>
            </tr>`;
        });
    }

    $("productTable").innerHTML=html;
}

    [...db.sales].reverse().forEach(s=>{

        html+=`

            <td>${money(s.total)}</td>
            <td>${escapeHTML(s.customer||"-")}</td>
            <td>${money(s.paid)}</td>
            <td>${money(s.due)}</td>

/* =========================
   DASHBOARD
========================= */

function calculateDashboard(){

    const sales=db.sales.reduce((a,s)=>a+Number(s.total||0),0);

    const purchase=db.purchases.reduce((a,p)=>a+Number(p.total||0),0);

    const gross=db.sales.reduce(
        (a,s)=>a+Number(s.total||0)-Number(s.cost||0),0
    );

    const expense=db.expenses.reduce(
        (a,e)=>a+Number(e.amount||0),0
    );

    const net=gross-expense;

    const due=db.sales.reduce(
        (a,s)=>a+Number(s.due||0),0
    )+
    db.customers.reduce(
        (a,c)=>a+Number(c.due||0)-Number(c.payment||0),0
    );

    const stock=db.products.reduce(
        (a,p)=>a+Number(p.stock||0)*Number(p.buy||0),0
    );

    const paid=db.sales.reduce(
        (a,s)=>a+Number(s.paid||0),0
    );

    const cash=paid-purchase-expense;

    if($("dashSales"))$("dashSales").innerText=money(sales);
    if($("dashPurchase"))$("dashPurchase").innerText=money(purchase);
    if($("dashGross"))$("dashGross").innerText=money(gross);
    if($("dashExpense"))$("dashExpense").innerText=money(expense);
    if($("dashNet"))$("dashNet").innerText=money(net);
    if($("dashDue"))$("dashDue").innerText=money(due);
    if($("dashStock"))$("dashStock").innerText=money(stock);
    if($("dashCash"))$("dashCash").innerText=money(cash);
    if($("dashProducts"))$("dashProducts").innerText=db.products.length;

    if($("recentSales")){

        let html="";

        [...db.sales].reverse().slice(0,10).forEach(s=>{

            html+=`
            <tr>
                <td>${escapeHTML(s.date)}</td>
                <td>${escapeHTML(s.product)}</td>
                <td>${s.qty}</td>
                <td>${money(s.total)}</td>
                <td>${money(s.paid)}</td>
                <td>${money(s.due)}</td>
            </tr>`;
        });

        $("recentSales").innerHTML=
            html||
            `<tr><td colspan="6" class="empty">কোনো Sale নেই</td></tr>`;
    }
}

/* =========================
   REPORT
========================= */

function dateInRange(date,from,to){

    if(from && date<from)return false;
    if(to && date>to)return false;

    return true;
}

function generateReport(){

    if(!$("reportFrom"))return;

    const from=$("reportFrom").value;
    const to=$("reportTo").value;

    const sales=db.sales.filter(s=>dateInRange(s.date,from,to));

    const purchases=db.purchases.filter(p=>dateInRange(p.date,from,to));

    const expenses=db.expenses.filter(e=>dateInRange(e.date,from,to));

    const totalSales=sales.reduce((a,s)=>a+Number(s.total||0),0);

    const totalPurchase=purchases.reduce((a,p)=>a+Number(p.total||0),0);

    const gross=sales.reduce(
        (a,s)=>a+Number(s.total||0)-Number(s.cost||0),0
    );

    const totalExpense=expenses.reduce(
        (a,e)=>a+Number(e.amount||0),0
    );

    const net=gross-totalExpense;

    const due=db.sales.reduce(
        (a,s)=>a+Number(s.due||0),0
    )+
    db.customers.reduce(
        (a,c)=>a+Number(c.due||0)-Number(c.payment||0),0
    );

    const stock=db.products.reduce(
        (a,p)=>a+Number(p.stock||0)*Number(p.buy||0),0
    );

    const paid=sales.reduce(
        (a,s)=>a+Number(s.paid||0),0
    );

    const cash=paid-totalPurchase-totalExpense;

    if($("reportSales"))$("reportSales").innerText=money(totalSales);
    if($("reportPurchase"))$("reportPurchase").innerText=money(totalPurchase);
    if($("reportGross"))$("reportGross").innerText=money(gross);
    if($("reportExpense"))$("reportExpense").innerText=money(totalExpense);
    if($("reportNet"))$("reportNet").innerText=money(net);
    if($("reportDue"))$("reportDue").innerText=money(due);
    if($("reportStock"))$("reportStock").innerText=money(stock);
    if($("reportCash"))$("reportCash").innerText=money(cash);
    if($("reportProducts"))$("reportProducts").innerText=db.products.length;
}

function reportToday(){

    const d=today();

    $("reportFrom").value=d;
    $("reportTo").value=d;

    generateReport();
}

function reportMonth(){

    const d=new Date();

    const from=
        d.getFullYear()+"-"+
        String(d.getMonth()+1).padStart(2,"0")+"-01";

    $("reportFrom").value=from;
    $("reportTo").value=today();

    generateReport();
}

function reportAll(){

    $("reportFrom").value="";
    $("reportTo").value="";

    generateReport();
}

/* =========================
   RENDER ALL
========================= */

function renderAll(){

    try{
        renderProducts();
        renderSales();
        renderPurchases();
        renderCustomers();
        renderExpenses();
        calculateDashboard();
        generateReport();
    }catch(e){
        console.error("Render Error:",e);
    }
}

document.addEventListener("DOMContentLoaded",()=>{

    $("productForm")?.addEventListener("submit",saveProduct);
    $("salesForm")?.addEventListener("submit",saveSale);
    $("purchaseForm")?.addEventListener("submit",savePurchase);
    $("customerForm")?.addEventListener("submit",saveCustomer);
    $("expenseForm")?.addEventListener("submit",saveExpense);

    if($("saleDate"))$("saleDate").value=today();
    if($("purchaseDate"))$("purchaseDate").value=today();
    if($("customerDate"))$("customerDate").value=today();
    if($("expenseDate"))$("expenseDate").value=today();

    renderAll();

    console.log("✅ Smart Store Ready");
});
