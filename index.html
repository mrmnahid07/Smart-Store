/* =========================================================
   BASIC HELPERS
   ========================================================= */

function getUser() {

  if (!auth || !auth.currentUser) {
    throw new Error("আপনি Login করেননি।");
  }

  return auth.currentUser;

}


function getUID() {

  return getUser().uid;

}


function userCollection(name) {

  return collection(
    db,
    "users",
    getUID(),
    name
  );

}


function userDoc(name, id) {

  return doc(
    db,
    "users",
    getUID(),
    name,
    String(id)
  );

}


function newId() {

  return (
    Date.now().toString(36) +
    Math.random().toString(36).substring(2, 10)
  );

}


function number(value) {

  const n = Number(value);

  return Number.isFinite(n) ? n : 0;

}


function money(value) {

  return "৳" + number(value).toLocaleString("en-BD");

}


function dateFormat(value) {

  if (!value) return "";

  const d = new Date(value);

  if (Number.isNaN(d.getTime())) {
    return "";
  }

  return d.toLocaleDateString("bn-BD");

}


function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================================================
   TOAST
   ========================================================= */

function toast(message) {

  const text = String(message || "");

  const el = document.getElementById("toast");

  if (!el) {
    alert(text);
    return;
  }

  el.textContent = text;
  el.style.display = "block";

  clearTimeout(window.__smartStoreToast);

  window.__smartStoreToast = setTimeout(() => {

    el.style.display = "none";

  }, 3000);

}


/* =========================================================
   FIREBASE ERROR
   ========================================================= */

function firebaseError(error) {

  const code = error?.code || "";

  switch (code) {

    case "auth/api-key-not-valid":
      return "Firebase API Key invalid।";

    case "auth/invalid-api-key":
      return "Firebase API Key invalid।";

    case "auth/operation-not-allowed":
      return "Firebase Console → Authentication → Sign-in method থেকে Email/Password চালু করুন।";

    case "auth/email-already-in-use":
      return "এই Email দিয়ে Account আগে থেকেই আছে।";

    case "auth/invalid-email":
      return "সঠিক Email দিন।";

    case "auth/weak-password":
      return "Password কমপক্ষে 6 অক্ষরের দিন।";

    case "auth/invalid-credential":
      return "Email অথবা Password ভুল।";

    case "auth/user-not-found":
      return "এই Email দিয়ে Account পাওয়া যায়নি।";

    case "auth/wrong-password":
      return "Password ভুল।";

    case "auth/network-request-failed":
      return "Internet connection পরীক্ষা করুন।";

    case "auth/too-many-requests":
      return "অনেকবার চেষ্টা হয়েছে। কিছুক্ষণ পর আবার চেষ্টা করুন।";

    case "auth/requires-recent-login":
      return "আবার Login করে চেষ্টা করুন।";

    case "permission-denied":
    case "firestore/permission-denied":
      return "Firestore Rules data access বন্ধ করে দিয়েছে।";

    case "unavailable":
      return "Firebase server unavailable।";

    default:
      return error?.message || "কাজটি করা যায়নি।";

  }

}

/* =========================================================
   CREATE ACCOUNT
   ========================================================= */

window.createAccount = async function () {

  try {

    if (!auth || !db) {
      toast("Firebase connection পাওয়া যায়নি।");
      return;
    }

    const name =
      document.getElementById("signupName")?.value.trim() || "";

    const email =
      document.getElementById("signupEmail")?.value.trim() || "";

    const password =
      document.getElementById("signupPassword")?.value || "";


    if (!name) {
      toast("আপনার নাম দিন।");
      return;
    }

    if (!email) {
      toast("Email দিন।");
      return;
    }

    if (password.length < 6) {
      toast("Password কমপক্ষে 6 অক্ষরের হতে হবে।");
      return;
    }


    const result =
      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );

    const user = result.user;


    try {

      await updateProfile(user, {
        displayName: name
      });

    } catch (_) {}


    await setDoc(
      doc(db, "users", user.uid),
      {
        name,
        email,
        createdAt: new Date().toISOString()
      }
    );


    await setDoc(
      doc(
        db,
        "users",
        user.uid,
        "settings",
        "main"
      ),
      {
        storeName: "Smart Store"
      }
    );


    try {
      await sendEmailVerification(user);
    } catch (_) {}


    const fields = [
      "signupName",
      "signupEmail",
      "signupPassword"
    ];

    fields.forEach(id => {

      const el = document.getElementById(id);

      if (el) {
        el.value = "";
      }

    });


    toast("Account সফলভাবে তৈরি হয়েছে।");

  } catch (error) {

    toast(firebaseError(error));

  }

};

/* =========================================================
   LOAD ONE COLLECTION
   ========================================================= */

async function loadCollection(name) {

  const snap =
    await getDocs(
      userCollection(name)
    );

  return snap.docs.map(item => ({
    id: item.id,
    ...item.data()
  }));

}


/* =========================================================
   LOAD ALL DATA
   ========================================================= */

async function loadAll() {

  const user = getUser();

  if (!user) return;


  try {

    const results =
      await Promise.all([
        loadCollection("products"),
        loadCollection("sales"),
        loadCollection("purchases"),
        loadCollection("expenses"),
        loadCollection("duePayments")
      ]);


    products = results[0];
    sales = results[1];
    purchases = results[2];
    expenses = results[3];
    duePayments = results[4];


    const settingsRef =
      doc(
        db,
        "users",
        user.uid,
        "settings",
        "main"
      );


    const settingsSnap =
      await getDoc(settingsRef);


    if (settingsSnap.exists()) {

      settings = {
        storeName:
          settingsSnap.data()?.storeName ||
          "Smart Store"
      };

    } else {

      settings = {
        storeName: "Smart Store"
      };

      await setDoc(
        settingsRef,
        settings
      );

    }


    const storeName =
      document.getElementById("storeName");

    const headerStore =
      document.getElementById("headerStore");


    if (storeName) {
      storeName.value = settings.storeName;
    }

    if (headerStore) {
      headerStore.textContent = settings.storeName;
    }


    renderAll();

  } catch (error) {

    console.error("LOAD ERROR:", error);

    throw error;

  }

}


/* =========================================================
   SAVE ITEM
   ========================================================= */

async function saveItem(collectionName, item) {

  if (!item || !item.id) {
    throw new Error("Invalid data.");
  }

  await setDoc(
    userDoc(collectionName, item.id),
    item
  );

}


/* =========================================================
   DELETE ITEM
   ========================================================= */

async function removeItem(collectionName, id) {

  await deleteDoc(
    userDoc(collectionName, id)
  );

}


/* =========================================================
   ADD PRODUCT
   ========================================================= */

window.addProduct = async function () {

  try {

    const name =
      document.getElementById("productName")?.value.trim() || "";

    const barcode =
      document.getElementById("productBarcode")?.value.trim() || "";

    const purchase =
      number(
        document.getElementById("productPurchase")?.value
      );

    const sale =
      number(
        document.getElementById("productSale")?.value
      );

    const stock =
      number(
        document.getElementById("productStock")?.value
      );


    if (!name) {
      toast("Product Name দিন।");
      return;
    }

    if (purchase < 0 || sale < 0 || stock < 0) {
      toast("Price এবং Stock সঠিক দিন।");
      return;
    }


    const item = {
      id: newId(),
      name,
      barcode,
      purchase,
      sale,
      stock,
      createdAt: new Date().toISOString()
    };


    await saveItem(
      "products",
      item
    );


    products.push(item);


    [
      "productName",
      "productBarcode",
      "productPurchase",
      "productSale",
      "productStock"
    ].forEach(id => {

      const el = document.getElementById(id);

  } catch (error) {

/* =========================================================
   DELETE PRODUCT
   ========================================================= */

window.deleteProduct = async function (id) {

  if (!confirm("Product delete করবেন?")) {
    return;
  }

  try {

    await removeItem(
      "products",
      id
    );


    products =
      products.filter(
        p => String(p.id) !== String(id)
      );


    renderAll();

    toast("Product deleted");

  } catch (error) {

    toast(firebaseError(error));

  }

};


/* =========================================================
   ADD SALE
   ========================================================= */

window.addSale = async function () {

  try {

    const productId =
      document.getElementById("saleProduct")?.value || "";

    const qty =
      number(
        document.getElementById("saleQty")?.value
      );

    const customer =
      document.getElementById("saleCustomer")?.value.trim() || "";

    const paid =
      number(
        document.getElementById("salePaid")?.value
      );


    const product =
      products.find(
        p => String(p.id) === String(productId)
      );


    if (!product) {
      toast("Product select করুন।");
      return;
    }

    if (qty <= 0) {
      toast("Quantity সঠিক দিন।");
      return;
    }

    if (number(product.stock) < qty) {
      toast("পর্যাপ্ত stock নেই।");
      return;
    }


    const total =
      number(product.sale) * qty;


    if (paid < 0 || paid > total) {
      toast("Paid amount সঠিক নয়।");
      return;
    }


    const due =
      Math.max(0, total - paid);


    const sale = {

      id: newId(),
      productId: product.id,
      productName: product.name,
      customer,
      qty,
      total,
      paid,
      due,
      date: new Date().toISOString()

    };


    /* নতুন stock আগে হিসাব */

    const updatedProduct = {
      ...product,
      stock: number(product.stock) - qty
    };


    /* Sale save */

    await saveItem(
      "sales",
      sale
    );


    /* Product stock save */

    await saveItem(
      "products",
      updatedProduct
    );


    let dueItem = null;


    if (due > 0) {

      dueItem = {

        id: newId(),
        customer: customer || "Unknown",
        amount: due,
        saleId: sale.id,
        date: new Date().toISOString()

      };


      await saveItem(
        "duePayments",
        dueItem
      );

    }


    /* Local data */

    products =
      products.map(
        p =>
          String(p.id) === String(product.id)
            ? updatedProduct
            : p
      );


    sales.push(sale);

    if (dueItem) {
      duePayments.push(dueItem);
    }


    renderAll();

    toast("Sale saved successfully");

  } catch (error) {

    toast(firebaseError(error));

  }

};


/* =========================================================
   DELETE SALE
   ========================================================= */

window.deleteSale = async function (id) {

  if (!confirm("Sale delete করবেন?")) {
    return;
  }


  try {

    const sale =
      sales.find(
        s => String(s.id) === String(id)
      );


    if (!sale) {
      toast("Sale পাওয়া যায়নি।");
      return;
    }


    const product =
      products.find(
        p =>
          String(p.id) ===
          String(sale.productId)
      );


    /* Restore stock */

    if (product) {

      const restoredProduct = {

        ...product,

        stock:
          number(product.stock) +
          number(sale.qty)

      };


      await saveItem(
        "products",
        restoredProduct
      );


      products =
        products.map(
          p =>
            String(p.id) === String(product.id)
              ? restoredProduct
              : p
        );

    }


    /* Delete sale */

    await removeItem(
      "sales",
      id
    );


    /* Delete related due */

    const relatedDue =
      duePayments.filter(
        d =>
          String(d.saleId || "") ===
          String(id)
      );


    for (const due of relatedDue) {

      await removeItem(
        "duePayments",
        due.id
      );

    }


    sales =
      sales.filter(
        s =>
          String(s.id) !== String(id)
      );


    duePayments =
      duePayments.filter(
        d =>
          String(d.saleId || "") !==
          String(id)
      );


    renderAll();

    toast("Sale deleted এবং stock restore হয়েছে।");

  } catch (error) {

    toast(firebaseError(error));

  }

};


/* =========================================================
   ADD PURCHASE
   ========================================================= */

window.addPurchase = async function () {

  try {

    const productId =
      document.getElementById("purchaseProduct")?.value || "";

    const qty =
      number(
        document.getElementById("purchaseQty")?.value
      );

    const total =
      number(
        document.getElementById("purchaseTotal")?.value
      );


    const product =
      products.find(
        p => String(p.id) === String(productId)
      );


    if (!product) {
      toast("Product select করুন।");
      return;
    }

    if (qty <= 0) {

    const purchase = {

      productId: product.id,
      productName: product.name,

    };


    const updatedProduct = {

    };


    await saveItem(

      purchase
    );


    await saveItem(
      "products",
      updatedProduct
    );


    purchases.push(purchase);


    products =

          String(p.id) === String(product.id)
            ? updatedProduct

      );

/* =========================================================
   DELETE PURCHASE
   ========================================================= */

window.deletePurchase = async function (id) {

  if (!confirm("Purchase delete করবেন?")) {
    return;
  }


  try {

    const purchase =
      purchases.find(
        p => String(p.id) === String(id)
      );


    if (!purchase) {
      toast("Purchase পাওয়া যায়নি।");
      return;
    }


    const product =
      products.find(
        p =>
          String(p.id) ===
          String(purchase.productId)
      );


    if (product) {

      const currentStock =
        number(product.stock);

      const qty =
        number(purchase.qty);


      if (currentStock < qty) {

        toast(
          "Purchase delete করলে stock negative হবে।"
        );

        return;

      }


      const updatedProduct = {

        ...product,

        stock:
          currentStock - qty

      };


      await saveItem(
        "products",
        updatedProduct
      );


      products =
        products.map(
          p =>
            String(p.id) === String(product.id)
              ? updatedProduct
              : p
        );

    }


    await removeItem(
      "purchases",
      id
    );


    purchases =
      purchases.filter(
        p =>
          String(p.id) !== String(id)
      );


    renderAll();

    toast("Purchase deleted");

  } catch (error) {

    toast(firebaseError(error));

  }

};

window.deleteExpense = async function (id) {

    products.map(p => `

      <option value="${escapeHtml(p.id)}">

/* =========================================================
   DASHBOARD
   ========================================================= */

function updateDashboard() {

  const totalSales =
    sales.reduce(
      (sum, item) =>
        sum + number(item.total),
      0
    );


  const totalPurchase =
    purchases.reduce(
      (sum, item) =>
        sum + number(item.total),
      0
    );


  const totalExpense =
    expenses.reduce(
      (sum, item) =>
        sum + number(item.amount),
      0
    );


  const totalDue =
    duePayments.reduce(
      (sum, item) =>
        sum + number(item.amount),
      0
    );


  const setText = (id, value) => {

    const el =
      document.getElementById(id);

    if (el) {
      el.textContent = value;
    }

  };


  setText("totalSales", money(totalSales));
  setText("totalPurchase", money(totalPurchase));
  setText("totalExpense", money(totalExpense));
  setText("totalDue", money(totalDue));
  setText("totalProducts", products.length);

  setText("reportSales", money(totalSales));
  setText("reportPurchase", money(totalPurchase));
  setText("reportExpense", money(totalExpense));
  setText("reportDue", money(totalDue));


  const profit =
    totalSales -
    totalPurchase -
    totalExpense;


  setText(
    "reportProfit",
    money(profit)
  );

}


/* =========================================================

window.showPage = function (page) {

  try {

    document
      .querySelectorAll("main > section")
      .forEach(section => {

        section.classList.add("hidden");

      });


    const target =
      document.getElementById(
        "page-" + page
      );


    if (target) {

      target.classList.remove("hidden");

    }


    document
      .querySelectorAll("nav button")
      .forEach(button => {

        button.classList.remove("active");

      });


    const nav =
      document.getElementById(
        "nav-" + page
      );


    if (nav) {
      nav.classList.add("active");
    }

  } catch (error) {

    console.error("Page error:", error);

  }

};

/* =========================================================
   ACCOUNT DELETE
   ========================================================= */

window.deleteAccount = async function () {

  if (!confirm(
    "Account permanently delete করবেন?\n\n" +
    "Products, Sales, Purchase, Due এবং Expense সব মুছে যাবে।"
  )) {
    return;
  }


  try {

    const user =
      auth?.currentUser;


    if (!user) {
      toast("Login করুন।");
      return;
    }


    const uid = user.uid;


    const names = [
      "products",
      "sales",
      "purchases",
      "expenses",
      "duePayments"
    ];


    for (const name of names) {

      const snap =
        await getDocs(
          collection(
            db,
            "users",
            uid,
            name
          )
        );


      let batch =
        writeBatch(db);

      let count = 0;


      for (const item of snap.docs) {

        batch.delete(item.ref);

        count++;


        if (count === 450) {

          await batch.commit();

          batch =
            writeBatch(db);

          count = 0;

        }

      }


      if (count > 0) {
        await batch.commit();
      }

    }


    await deleteDoc(
      doc(
        db,
        "users",
        uid,
        "settings",
        "main"
      )
    ).catch(() => {});


    await deleteDoc(
      doc(
        db,
        "users",
        uid
      )
    );


    await deleteUser(user);


    products = [];
    sales = [];
    purchases = [];
    expenses = [];
    duePayments = [];


    toast("Account permanently deleted");

  } catch (error) {

    toast(firebaseError(error));

  }

};


/* =========================================================
   BACKUP
   ========================================================= */

window.downloadBackup = function () {

  try {

    const backup = {

      version: 1,
      exportedAt: new Date().toISOString(),

      settings,
      products,
      sales,
      purchases,
      expenses,
      duePayments

    };


    const blob =
      new Blob(
        [
          JSON.stringify(
            backup,
            null,
            2
          )
        ],
        {
          type: "application/json"
        }
      );


    const url =
      URL.createObjectURL(blob);


    const a =
      document.createElement("a");


    a.href = url;

    a.download =
      "smart-store-backup-" +
      Date.now() +
      ".json";


    document.body.appendChild(a);

    a.click();

    a.remove();


    setTimeout(
      () => URL.revokeObjectURL(url),
      1000
    );


    toast("Backup downloaded");

  } catch (error) {

    toast("Backup তৈরি করা যায়নি।");

  }

};


/* =========================================================
   CLEAR COLLECTION
   ========================================================= */

async function clearUserCollection(name) {

  const snap =
    await getDocs(
      userCollection(name)
    );


  let batch =
    writeBatch(db);

  let count = 0;


  for (const item of snap.docs) {

    batch.delete(item.ref);

    count++;


    if (count === 450) {

      await batch.commit();

      batch =
        writeBatch(db);

      count = 0;

    }

  }


  if (count > 0) {
    await batch.commit();
  }

}


/* =========================================================
   RESTORE BACKUP
   ========================================================= */

window.restoreBackup = async function (event) {

  const file =
    event?.target?.files?.[0];


  if (!file) return;


  try {

    if (!auth?.currentUser) {
      throw new Error("আগে Login করুন।");
    }


    const text =
      await file.text();


    let data;


    try {

      data =
        JSON.parse(text);

    } catch (_) {

      throw new Error(
        "Backup file valid JSON নয়।"
      );

    }


    if (
      !data ||
      typeof data !== "object"
    ) {

      throw new Error(
        "Backup file format ভুল।"
      );

    }


    const names = [
      "products",
      "sales",
      "purchases",
      "expenses",
      "duePayments"
    ];


    for (const name of names) {

      if (
        data[name] !== undefined &&
        !Array.isArray(data[name])
      ) {

        throw new Error(
          name + " data ভুল।"
        );

      }

    }


    if (!confirm(
      "বর্তমান data replace হবে।\n\nContinue?"
    )) {

      event.target.value = "";
      return;

    }


    /* Clear old */

    for (const name of names) {

      await clearUserCollection(name);

    }


    /* Restore */

    for (const name of names) {

      const items =
        Array.isArray(data[name])
          ? data[name]
          : [];


      let batch =
        writeBatch(db);

      let count = 0;


      for (const item of items) {

        if (!item || !item.id) {
          continue;
        }


        batch.set(
          userDoc(name, item.id),
          item
        );


        count++;


        if (count === 450) {

          await batch.commit();

          batch =
            writeBatch(db);

          count = 0;

        }

      }


      if (count > 0) {
        await batch.commit();
      }

    }


    settings = {

      storeName:
        String(
          data.settings?.storeName ||
          "Smart Store"
        )

    };


    await setDoc(
      doc(
        db,
        "users",
        getUID(),
        "settings",
        "main"
      ),
      settings
    );


    await loadAll();


    event.target.value = "";

    toast("Backup restored successfully");

  } catch (error) {

    if (event?.target) {
      event.target.value = "";
    }

    toast(
      "Restore failed: " +
      firebaseError(error)
    );

  }

};


/* =========================================================
   AUTH STATE
   ========================================================= */

if (auth) {

  onAuthStateChanged(
    auth,
    async user => {

      const login =
        document.getElementById("loginScreen");

      const signup =
        document.getElementById("signupScreen");

      const app =
        document.getElementById("app");


      if (user) {

        if (login) {
          login.classList.add("hidden");
        }

        if (signup) {
          signup.classList.add("hidden");
        }

        if (app) {
          app.style.display = "block";
        }


        const emailEl =
          document.getElementById("userEmail");

        const accountEl =
          document.getElementById("accountInfo");


        if (emailEl) {
          emailEl.textContent =
            user.email || "";
        }


        if (accountEl) {

          accountEl.textContent =
            `${user.displayName || "User"} | ${user.email || ""}`;

        }


        try {

          await loadAll();

          /* Dashboard থাকলে শুধু তখনই দেখাবে */

          const dashboard =
            document.getElementById(
              "page-dashboard"
            );


          if (dashboard) {
            window.showPage("dashboard");
          }

        } catch (error) {

          console.error(
            "DATA LOAD ERROR:",
            error
          );


          toast(
            "Data load হয়নি: " +
            firebaseError(error)
          );

        }

      } else {

        if (app) {
          app.style.display = "none";
        }

        if (signup) {
          signup.classList.add("hidden");
        }

        if (login) {
          login.classList.remove("hidden");
        }

      }

    }
  );

}
