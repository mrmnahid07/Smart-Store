<script>
"use strict";

/* =====================================================
   SMART STORE - FIREBASE FREE
   LOCAL STORAGE DATABASE
===================================================== */

const DB_KEY = "smartStoreDB";

function $(id){
    return document.getElementById(id);
}

/* =====================================================
   SAFE DATABASE LOAD
===================================================== */

function defaultDB(){
    return {
        products: [],
        sales: [],
        purchases: [],
        customers: [],
        expenses: []
    };
}

function loadDB(){

    try{

        const saved = localStorage.getItem(DB_KEY);

        if(!saved){
            return defaultDB();
        }

        const data = JSON.parse(saved);

        if(!data || typeof data !== "object"){
            return defaultDB();
        }

        return {
            products: Array.isArray(data.products) ? data.products : [],
            sales: Array.isArray(data.sales) ? data.sales : [],
            purchases: Array.isArray(data.purchases) ? data.purchases : [],
            customers: Array.isArray(data.customers) ? data.customers : [],
            expenses: Array.isArray(data.expenses) ? data.expenses : []
        };

    }catch(error){

        console.error("Database Load Error:", error);

        return defaultDB();
    }
}

let db = loadDB();

/* =====================================================
   SAVE DATABASE
===================================================== */

function save(){

    try{

        localStorage.setItem(
            DB_KEY,
            JSON.stringify(db)
        );

        renderAll();

    }catch(error){

        console.error("Database Save Error:", error);

        alert("Data save করা যায়নি। Browser storage check করুন।");
    }
}

/* =====================================================
   TODAY
===================================================== */

function today(){

    const d = new Date();

    const month = String(
        d.getMonth()+1
    ).padStart(2,"0");

    const day = String(
        d.getDate()
    ).padStart(2,"0");

    return d.getFullYear()+"-"+month+"-"+day;
}

/* =====================================================
   MONEY
===================================================== */

function money(value){

    const n = Number(value || 0);

    return "৳" + n.toLocaleString(
        "en-BD",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    );
}

/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

/* =====================================================
   PAGE NAVIGATION
===================================================== */

function showPage(page, button){

    document.querySelectorAll(".page").forEach(function(p){
        p.classList.remove("active");
    });

    const target = $(page);

    if(target){
        target.classList.add("active");
    }

    document.querySelectorAll(".menu button").forEach(function(b){
        b.classList.remove("active");
    });

    if(button){
        button.classList.add("active");
    }

    const titles = {

        dashboard:"🏠 Dashboard",
        products:"📦 Products",
        sales:"🛒 Sales",
        purchase:"🚚 Purchase",
        customers:"👥 Customers",
        expenses:"💸 Expenses",
        reports:"📊 Reports"

    };

    if($("pageTitle")){
        $("pageTitle").innerText =
            titles[page] || "Smart Store";
    }
}

/* =====================================================
   FIND PRODUCT
===================================================== */

function findProduct(name){

    const search = String(name || "")
        .trim()
        .toLowerCase();

    return db.products.find(function(p){

        return String(p.name || "")
            .trim()
            .toLowerCase() === search;

    });
}

/* =====================================================
   PRODUCT
===================================================== */

function resetProductForm(){

    const form = $("productForm");

    if(form){
        form.reset();
    }

    if($("productId")){
        $("productId").value = "";
    }

    if($("productSubmit")){
        $("productSubmit").innerText =
            "➕ Add Product";
    }
}

function editProduct(id){

    const p = db.products.find(function(x){
        return x.id === id;
    });

    if(!p) return;

    $("productId").value = p.id;
    $("productName").value = p.name || "";
    $("productCode").value = p.code || "";
    $("productBuy").value = p.buy || 0;
    $("productSell").value = p.sell || 0;
    $("productStock").value = p.stock || 0;

    $("productSubmit").innerText =
        "💾 Update Product";

    showPage(
        "products",
        document.querySelectorAll(".menu button")[1]
    );
}

function deleteProduct(id){

    if(!confirm("এই Product Delete করতে চান?")){
        return;
    }

    db.products = db.products.filter(function(p){
        return p.id !== id;
    });

    save();
}

function saveProduct(e){

    e.preventDefault();

    const id = $("productId").value;

    const name = $("productName").value.trim();

    const code = $("productCode").value.trim();

    const buy = Number(
        $("productBuy").value || 0
    );

    const sell = Number(
        $("productSell").value || 0
    );

    const stock = Number(
        $("productStock").value || 0
    );

    if(!name){

        alert("Product Name লিখুন");
        return;
    }

    const product = {

        id: id || Date.now().toString(),

        name: name,

        code: code,

        buy: buy,

        sell: sell,

        stock: stock

    };

    if(id){

        const index = db.products.findIndex(
            function(p){
                return p.id === id;
            }
        );

        if(index !== -1){
            db.products[index] = product;
        }

    }else{

        db.products.push(product);
    }

    resetProductForm();

    save();

    alert("Product Successfully Saved");
}

/* =====================================================
   SALE PRICE
===================================================== */

function autoSalePrice(){

    const product = findProduct(
        $("saleProduct").value
    );

    if(product){

        $("salePrice").value =
            product.sell;

        $("saleCost").value =
            product.buy;
    }

    calculateSale();
}

function calculateSale(){

    const qty = Number(
        $("saleQty").value || 0
    );

    const price = Number(
        $("salePrice").value || 0
    );

    const paid = Number(
        $("salePaid").value || 0
    );

    const total = qty * price;

    const due = Math.max(
        0,
        total - paid
    );

    $("saleTotal").value =
        total.toFixed(2);

    $("saleDue").value =
        due.toFixed(2);

    const product = findProduct(
        $("saleProduct").value
    );

    if(product){

        $("saleCost").value =
            product.buy;
    }
}

/* =====================================================
   SALE
===================================================== */

function resetSaleForm(){

    const form = $("salesForm");

    if(form){
        form.reset();
    }

    $("saleId").value = "";

    $("saleDate").value = today();

    $("salePaid").value = 0;

    $("saleTotal").value = 0;

    $("saleDue").value = 0;

    $("saleCost").value = 0;

    $("saleSubmit").innerText =
        "➕ Add Sale";
}

function saveSale(e){

    e.preventDefault();

    const id = $("saleId").value;

    const name =
        $("saleProduct").value.trim();

    const qty =
        Number($("saleQty").value || 0);

    const price =
        Number($("salePrice").value || 0);

    const paid =
        Number($("salePaid").value || 0);

    const product =
        findProduct(name);

    if(!name){

        alert("Product Name লিখুন");
        return;
    }

    if(qty <= 0){

        alert("Quantity সঠিকভাবে লিখুন");
        return;
    }

    if(price < 0){

        alert("Sale Price সঠিক নয়");
        return;
    }

    const total = qty * price;

    if(paid > total){

        alert(
            "Paid Total-এর চেয়ে বেশি হতে পারবে না"
        );

        return;
    }

    /* EDIT হলে পুরোনো stock ফেরত */

    if(id){

        const oldSale =
            db.sales.find(function(s){
                return s.id === id;
            });

        if(oldSale){

            const oldProduct =
                findProduct(oldSale.product);

            if(oldProduct){

                oldProduct.stock +=
                    Number(oldSale.qty || 0);
            }
        }
    }

    /* Product থাকলে stock check */

    let currentProduct =
        findProduct(name);

    let cost = 0;

    if(currentProduct){

        if(currentProduct.stock < qty){

            alert(
                "Stock পর্যাপ্ত নেই। Current Stock: "
                + currentProduct.stock
            );

            /* EDIT reverse */

            if(id){

                const oldSale =
                    db.sales.find(function(s){
                        return s.id === id;
                    });

                if(oldSale){

                    const oldProduct =
                        findProduct(oldSale.product);

                    if(oldProduct){

                        oldProduct.stock -=
                            Number(oldSale.qty || 0);
                    }
                }
            }

            return;
        }

        currentProduct.stock -= qty;

        cost =
            qty * Number(currentProduct.buy || 0);

    }else{

        alert(
            "এই নামে কোনো Product নেই। আগে Product Add করুন।"
        );

        /* EDIT reverse */

        if(id){

            const oldSale =
                db.sales.find(function(s){
                    return s.id === id;
                });

            if(oldSale){

                const oldProduct =
                    findProduct(oldSale.product);

                if(oldProduct){

                    oldProduct.stock -=
                        Number(oldSale.qty || 0);
                }
            }
        }

        return;
    }

    const sale = {

        id: id || Date.now().toString(),

        date:
            $("saleDate").value || today(),

        product:name,

        qty:qty,

        price:price,

        total:total,

        paid:paid,

        due:
            Math.max(0,total-paid),

        customer:
            $("saleCustomer").value.trim(),

        cost:cost

    };

    if(id){

        const index =
            db.sales.findIndex(function(s){
                return s.id === id;
            });

        if(index !== -1){

            db.sales[index] = sale;
        }

    }else{

        db.sales.push(sale);
    }

    resetSaleForm();

    save();

    alert("Sale Successfully Saved");
}

function editSale(id){

    const s =
        db.sales.find(function(x){
            return x.id === id;
        });

    if(!s) return;

    $("saleId").value = s.id;
    $("saleDate").value = s.date;
    $("saleProduct").value = s.product;
    $("saleQty").value = s.qty;
    $("salePrice").value = s.price;
    $("saleCustomer").value =
        s.customer || "";
    $("salePaid").value = s.paid;
    $("saleTotal").value = s.total;
    $("saleDue").value = s.due;
    $("saleCost").value = s.cost;

    $("saleSubmit").innerText =
        "💾 Update Sale";

    showPage(
        "sales",
        document.querySelectorAll(".menu button")[2]
    );
}

function deleteSale(id){

    if(!confirm("এই Sale Delete করতে চান?")){
        return;
    }

    const sale =
        db.sales.find(function(s){
            return s.id === id;
        });

    if(sale){

        const product =
            findProduct(sale.product);

        if(product){

            product.stock +=
                Number(sale.qty || 0);
        }
    }

    db.sales =
        db.sales.filter(function(s){
            return s.id !== id;
        });

    save();
}

function resetPurchaseForm(){

    }

    $("purchaseId").value = "";

    $("purchaseDate").value = today();

    $("purchaseSubmit").innerText =
        "➕ Add Purchase";
}

function savePurchase(e){

    e.preventDefault();

    const id =
        $("purchaseId").value;

    const name =
        $("purchaseProduct").value.trim();

    const qty =
        Number($("purchaseQty").value || 0);

    const price =
        Number($("purchasePrice").value || 0);

    const sell =
        Number($("purchaseSell").value || 0);

    if(!name){

        alert("Product Name লিখুন");
        return;
    }

    if(qty <= 0){

        alert("Quantity সঠিকভাবে লিখুন");
        return;
    }

    if(price < 0){

        alert("Purchase Price সঠিক নয়");
        return;
    }

    /* EDIT reverse */

    if(id){

        const old =
            db.purchases.find(function(p){
                return p.id === id;
            });

        if(old){

            const oldProduct =
                findProduct(old.product);

            if(oldProduct){

                oldProduct.stock -=
                    Number(old.qty || 0);
            }
        }
    }

    let product =
        findProduct(name);

    if(product){

        product.stock += qty;

        product.buy = price;

        if(sell > 0){
            product.sell = sell;
        }

    }else{

        product = {

            id: Date.now().toString(),

            name:name,

            code:"",

            buy:price,

            sell:sell || price,

            stock:qty
        };

        db.products.push(product);
    }

    const purchase = {

        id:
            id || Date.now().toString(),

        date:
            $("purchaseDate").value || today(),

        product:name,

        qty:qty,

        price:price,

        total:qty * price,

        supplier:
            $("purchaseSupplier").value.trim()
    };

    if(id){

        const index =
            db.purchases.findIndex(function(p){
                return p.id === id;
            });

        if(index !== -1){

            db.purchases[index] =
                purchase;
        }

    }else{

        db.purchases.push(purchase);
    }

    resetPurchaseForm();

    save();

    alert("Purchase Successfully Saved");
}

function editPurchase(id){

    const p =
        db.purchases.find(function(x){
            return x.id === id;
        });

    if(!p) return;

    $("purchaseId").value = p.id;
    $("purchaseDate").value = p.date;
    $("purchaseProduct").value = p.product;
    $("purchaseQty").value = p.qty;
    $("purchasePrice").value = p.price;
    $("purchaseSupplier").value =
        p.supplier || "";

    const product =
        findProduct(p.product);

    $("purchaseSell").value =
        product ? product.sell : "";

    $("purchaseSubmit").innerText =
        "💾 Update Purchase";

    showPage(
        "purchase",
        document.querySelectorAll(".menu button")[3]
    );
}

function deletePurchase(id){

    if(!confirm(
        "এই Purchase Delete করতে চান?"
    )){
        return;
    }

    const purchase =
        db.purchases.find(function(p){
            return p.id === id;
        });

    if(purchase){

        const product =
            findProduct(purchase.product);

        if(product){

            product.stock =
                Math.max(
                    0,
                    product.stock -
                    Number(purchase.qty || 0)
                );
        }
    }

    db.purchases =
        db.purchases.filter(function(p){
            return p.id !== id;
        });

    save();
}

/* =====================================================
   RENDER PRODUCTS
===================================================== */

function renderProducts(){

    let html = "";

    if(db.products.length === 0){

        html = `
        <tr>
            <td colspan="7" class="empty">
                কোনো Product নেই
            </td>
        </tr>`;

    }else{

        db.products.forEach(function(p){

            html += `
            <tr>

                <td>${escapeHTML(p.name)}</td>

                <td>${escapeHTML(p.code || "-")}</td>

                <td>${money(p.buy)}</td>

                <td>${money(p.sell)}</td>

                <td>
                    <span class="badge ${
                        Number(p.stock) > 0
                        ? "badge-green"
                        : "badge-red"
                    }">
                        ${Number(p.stock || 0)}
                    </span>
                </td>

                <td>
                    ${money(
                        Number(p.stock || 0) *
                        Number(p.buy || 0)
                    )}
                </td>

                <td>

                    <div class="action-buttons">

                        <button
                            class="btn btn-warning"
                            onclick="editProduct('${p.id}')">
                            Edit
                        </button>

                        <button
                            class="btn btn-danger"
                            onclick="deleteProduct('${p.id}')">
                            Delete
                        </button>

                    </div>

                </td>

            </tr>`;
        });
    }

    $("productTable").innerHTML =
        html;
}

function renderCustomers(){

    if(db.customers.length === 0){

        html = `
        <tr>
            <td colspan="8" class="empty">
                কোনো Customer নেই
            </td>
        </tr>`;

    }else{

        [...db.customers]
            .reverse()
            .forEach(function(c){

                const balance =
                    Number(c.due || 0) -
                    Number(c.payment || 0);

                html += `
                <tr>

                    <td>${escapeHTML(c.date)}</td>

                    <td>${escapeHTML(c.name)}</td>

                    <td>
                        ${escapeHTML(
                            c.mobile || "-"
                        )}
                    </td>

                    <td>
                        ${escapeHTML(
                            c.address || "-"
                        )}
                    </td>

                    <td>${money(c.due)}</td>

                    <td>${money(c.payment)}</td>

                    <td>
                        <span class="badge ${
                            balance > 0
                            ? "badge-red"
                            : "badge-green"
                        }">
                            ${money(balance)}
                        </span>
                    </td>

                    <td>

                        <div class="action-buttons">

                            <button
                                class="btn btn-warning"
                                onclick="editCustomer('${c.id}')">
                                Edit
                            </button>

                            <button
                                class="btn btn-danger"
                                onclick="deleteCustomer('${c.id}')">
                                Delete
                            </button>

                        </div>

                    </td>

                </tr>`;
            });
    }

    $("customerTable").innerHTML =
        html;
}

/* =====================================================
   DASHBOARD
===================================================== */

function calculateDashboard(){

    const sales =
        db.sales.reduce(
            (sum,s) =>
                sum + Number(s.total || 0),
            0
        );

    const purchase =
        db.purchases.reduce(
            (sum,p) =>
                sum + Number(p.total || 0),
            0
        );

    const gross =
        db.sales.reduce(
            (sum,s) =>
                sum +
                Number(s.total || 0) -
                Number(s.cost || 0),
            0
        );

    const expenses =
        db.expenses.reduce(
            (sum,e) =>
                sum + Number(e.amount || 0),
            0
        );

    const net =
        gross - expenses;

    const salesDue =
        db.sales.reduce(
            (sum,s) =>
                sum + Number(s.due || 0),
            0
        );

    const customerDue =
        db.customers.reduce(
            (sum,c) =>
                sum +
                Number(c.due || 0) -
                Number(c.payment || 0),
            0
        );

    const totalDue =
        salesDue + customerDue;

    const stockValue =
        db.products.reduce(
            (sum,p) =>
                sum +
                Number(p.stock || 0) *
                Number(p.buy || 0),
            0
        );

    const paidSales =
        db.sales.reduce(
            (sum,s) =>
                sum + Number(s.paid || 0),
            0
        );

    const cash =
        paidSales -
        purchase -
        expenses;

    $("dashSales").innerText =
        money(sales);

    $("dashPurchase").innerText =
        money(purchase);

    $("dashGross").innerText =
        money(gross);

    $("dashExpense").innerText =
        money(expenses);

    $("dashNet").innerText =
        money(net);

    $("dashDue").innerText =
        money(totalDue);

    $("dashStock").innerText =
        money(stockValue);

    $("dashCash").innerText =
        money(cash);

    $("dashProducts").innerText =
        db.products.length;

    let recent = "";

    [...db.sales]
        .reverse()
        .slice(0,10)
        .forEach(function(s){

            recent += `
            <tr>

                <td>${escapeHTML(s.date)}</td>

                <td>${escapeHTML(s.product)}</td>

                <td>${s.qty}</td>

                <td>${money(s.total)}</td>

                <td>${money(s.paid)}</td>

                <td>${money(s.due)}</td>

            </tr>`;
        });

    if(!recent){

        recent = `
        <tr>
            <td colspan="6" class="empty">
                কোনো Sale নেই
            </td>
        </tr>`;
    }

    $("recentSales").innerHTML =
        recent;
}

/* =====================================================
   REPORT
===================================================== */

function dateInRange(date,from,to){

    if(from && date < from){
        return false;
    }

    if(to && date > to){
        return false;
    }

    return true;
}

function generateReport(){

    const from =
        $("reportFrom").value;

    const to =
        $("reportTo").value;

    const sales =
        db.sales.filter(function(s){
            return dateInRange(
                s.date,
                from,
                to
            );
        });

    const purchases =
        db.purchases.filter(function(p){
            return dateInRange(
                p.date,
                from,
                to
            );
        });

    const expenses =
        db.expenses.filter(function(e){
            return dateInRange(
                e.date,
                from,
                to
            );
        });

    const totalSales =
        sales.reduce(
            (sum,s) =>
                sum + Number(s.total || 0),
            0
        );

    const totalPurchase =
        purchases.reduce(
            (sum,p) =>
                sum + Number(p.total || 0),
            0
        );

    const gross =
        sales.reduce(
            (sum,s) =>
                sum +
                Number(s.total || 0) -
                Number(s.cost || 0),
            0
        );

    const totalExpense =
        expenses.reduce(
            (sum,e) =>
                sum + Number(e.amount || 0),
            0
        );

    const net =
        gross - totalExpense;

    const salesDue =
        db.sales.reduce(
            (sum,s) =>
                sum + Number(s.due || 0),
            0
        );

    const customerDue =
        db.customers.reduce(
            (sum,c) =>
                sum +
                Number(c.due || 0) -
                Number(c.payment || 0),
            0
        );

    const totalDue =
        salesDue + customerDue;

    const stockValue =
        db.products.reduce(
            (sum,p) =>
                sum +
                Number(p.stock || 0) *
                Number(p.buy || 0),
            0
        );

    const paidSales =
        sales.reduce(
            (sum,s) =>
                sum + Number(s.paid || 0),
            0
        );

    const cash =
        paidSales -
        totalPurchase -
        totalExpense;

    $("reportSales").innerText =
        money(totalSales);

    $("reportPurchase").innerText =
        money(totalPurchase);

    $("reportGross").innerText =
        money(gross);

    $("reportExpense").innerText =
        money(totalExpense);

    $("reportNet").innerText =
        money(net);

    $("reportDue").innerText =
        money(totalDue);

    $("reportStock").innerText =
        money(stockValue);

    $("reportCash").innerText =
        money(cash);

    $("reportProducts").innerText =
        db.products.length;
}

function reportToday(){

    const d = today();

    $("reportFrom").value = d;

    $("reportTo").value = d;

    generateReport();
}

function reportMonth(){

    const d = new Date();

    const year =
        d.getFullYear();

    const month =
        String(
            d.getMonth()+1
        ).padStart(2,"0");

    $("reportFrom").value =
        year+"-"+month+"-01";

    $("reportTo").value =
        today();

    generateReport();
}

function reportAll(){

    $("reportFrom").value = "";

    $("reportTo").value = "";

    generateReport();
}

function renderAll(){

    try{

        renderProducts();

        renderSales();

        renderPurchases();

        renderExpenses();

        calculateDashboard();

        generateReport();

    }catch(error){

        console.error(

    }
}
