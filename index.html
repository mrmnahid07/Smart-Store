/* =====================================================
   REGISTER
===================================================== */

async function createAccount(){

    if(!auth || !firestore){

        alert(
            "Firebase connection পাওয়া যাচ্ছে না।"
        );

        return;
    }

    const email=
        $("registerEmail").value.trim();

    const password=
        $("registerPassword").value;

    const confirm=
        $("registerConfirm").value;


    if(!email || !password || !confirm){

        $("registerMessage").innerText=
            "সব তথ্য পূরণ করুন।";

        return;

    }


    if(password!==confirm){

        $("registerMessage").innerText=
            "Password মিলছে না।";

        return;

    }


    if(password.length<6){

        $("registerMessage").innerText=
            "Password কমপক্ষে 6 characters হতে হবে।";

        return;

    }


    $("registerMessage").innerText=
        "Account তৈরি হচ্ছে...";


    try{

        const result=
            await auth.createUserWithEmailAndPassword(
                email,
                password
            );


        const user=result.user;


        /* ==========================================
           USER FIRESTORE DOCUMENT
        ========================================== */

        await firestore
            .collection("users")
            .doc(user.uid)
            .set({

                email:user.email,

                status:"disabled",

                accessUntil:null,

                createdAt:
                    firebase.firestore.FieldValue
                    .serverTimestamp()

            });


        await auth.signOut();


        $("registerMessage").innerText=
            "Account তৈরি হয়েছে। Owner access দিলে ব্যবহার করতে পারবেন।";


        setTimeout(()=>{

            showLogin();

        },1500);


    }catch(error){

        console.error(error);

        $("registerMessage").innerText=
            firebaseErrorMessage(error);

    }

}

/* =====================================================
   CHECK USER ACCESS
===================================================== */

async function checkUserAccess(user){

    /* OWNER */

    if(user.uid===OWNER_UID){

        return true;

    }


    try{

        const doc=
            await firestore
                .collection("users")
                .doc(user.uid)
                .get();


        if(!doc.exists){

            await auth.signOut();

            alert(
                "আপনার account পাওয়া যায়নি। Owner-এর সাথে যোগাযোগ করুন।"
            );

            return false;

        }


        const data=doc.data();


        /* DISABLED */

        if(data.status!=="enabled"){

            await auth.signOut();

            alert(
                "আপনার account বর্তমানে Disabled।\n\nOwner access দিলে Smart Store ব্যবহার করতে পারবেন।"
            );

            return false;

        }


        /* NO EXPIRY */

        if(!data.accessUntil){

            await auth.signOut();

            alert(
                "আপনার access এখনো দেওয়া হয়নি।"
            );

            return false;

        }


        const expiry=
            data.accessUntil.toDate();


        /* EXPIRED */

        if(new Date()>=expiry){

            await firestore
                .collection("users")
                .doc(user.uid)
                .update({

                    status:"disabled",

                    accessUntil:null

                });


            await auth.signOut();


            alert(
                "আপনার 30 দিনের access শেষ হয়ে গেছে।"
            );


            return false;

        }


        return true;


    }catch(error){

        console.error(
            "Access Check Error:",
            error
        );


        await auth.signOut();


        alert(
            "Access যাচাই করা যাচ্ছে না। আবার চেষ্টা করুন।"
        );


        return false;

    }

}


/* =====================================================
   ENABLE USER — 30 DAYS
===================================================== */

async function enableUser(uid){

    if(
        !auth.currentUser ||
        auth.currentUser.uid!==OWNER_UID
    ){

        alert(
            "শুধু Owner user access দিতে পারবেন।"
        );

        return;

    }


    try{

        const expiry=new Date();

        expiry.setDate(
            expiry.getDate()+30
        );


        await firestore
            .collection("users")
            .doc(uid)
            .update({

                status:"enabled",

                accessUntil:
                    firebase.firestore.Timestamp
                    .fromDate(expiry)

            });


        alert(
            "✅ User Enabled\n\n30 দিনের access দেওয়া হয়েছে।"
        );


        loadUsers();


    }catch(error){

        console.error(error);

        alert(
            "User enable করা যায়নি.\n\n"+
            error.message
        );

    }

}

/* =====================================================
   OWNER USER LIST
===================================================== */

async function loadUsers(){

    if(
        !auth.currentUser ||
        auth.currentUser.uid!==OWNER_UID
    ){

        return;

    }


    const box=
        $("userList");


    if(!box){

        return;

    }


    box.innerHTML=
        "Loading...";


    try{

        const snapshot=
            await firestore
                .collection("users")
                .get();


        let html="";


        snapshot.forEach(doc=>{

            const data=doc.data();


            let status=
                data.status==="enabled"
                ? "Enabled"
                : "Disabled";


            let expiry="বন্ধ";


            if(data.accessUntil){

                expiry=
                    data.accessUntil
                        .toDate()
                        .toLocaleDateString(
                            "en-GB"
                        );

            }


            html+=`

                <div class="user-item">

                    <div>

                        <b>
                            ${escapeHTML(
                                data.email || "Unknown"
                            )}
                        </b>

                        <br>

                        Status:
                        <strong>
                            ${status}
                        </strong>

                        <br>

                        Access Until:
                        ${expiry}

                    </div>


                    <div>

                        <button
                            type="button"
                            onclick="enableUser('${doc.id}')"
                        >
                            ✅ Enable 30 Days
                        </button>


                        <button
                            type="button"
                            onclick="disableUser('${doc.id}')"
                        >
                            🚫 Disable
                        </button>

                    </div>

                </div>

            `;

        });


        box.innerHTML=
            html ||
            "কোনো registered user নেই.";


    }catch(error){

        console.error(error);

        box.innerHTML=
            "User list load করা যায়নি.";

    }

}


/* =====================================================

if(auth){

    auth.onAuthStateChanged(
        async user=>{

            const authScreen=
                $("authScreen");

            const sidebar=
                document.querySelector(
                    ".sidebar"
                );

            const main=
                document.querySelector(

                );

            const ownerPanel=
                $("ownerPanel");


            /* NOT LOGGED IN */

            if(!user){

                if(typeof stopInactivityTimer==="function"){
                    stopInactivityTimer();
                }


                authScreen.style.display=
                    "flex";


                sidebar.style.display=
                    "none";


                main.style.display=
                    "none";


                if(ownerPanel){

                    ownerPanel.style.display=
                        "none";

                }


                if(typeof showLogin==="function"){

                    showLogin();

                }


                return;

            }


            /* ACCESS CHECK */

            const allowed=
                await checkUserAccess(user);


            if(!allowed){

                authScreen.style.display=
                    "flex";


                sidebar.style.display=
                    "none";


                main.style.display=
                    "none";


                if(ownerPanel){

                    ownerPanel.style.display=
                        "none";

                }


                return;

            }


            /* ACCESS ALLOWED */

            authScreen.style.display=
                "none";


            sidebar.style.display=
                "block";


            main.style.display=
                "block";


            if($("loggedUserEmail")){

                $("loggedUserEmail").innerText=
                    "👤 "+
                    (user.email || "User");

            }


            if(
                typeof resetInactivityTimer===
                "function"
            ){

                resetInactivityTimer();

            }


            /* OWNER */

            if(user.uid===OWNER_UID){

                if(ownerPanel){

                    ownerPanel.style.display=
                        "block";

                }


                loadUsers();

            }else{

                if(ownerPanel){

                    ownerPanel.style.display=
                        "none";

                }

            }


            renderAll();

        }
    );

}

function calculateCustomerDue(){

    const opening=Number(
        $("customerDue").value||0
    );

    const payment=Number(
        $("customerPayment").value||0
    );

    $("customerTotalDue").value=
        Math.max(
            0,
            opening-payment
        ).toFixed(2);

}


$("customerForm").addEventListener(
    "submit",
    e=>{

        e.preventDefault();

        const id=$("customerId").value;

        const date=$("customerDate").value;

        const name=$("customerName")
            .value.trim();

        const mobile=$("customerMobile")
            .value.trim();

        const address=$("customerAddress")
            .value.trim();

        const due=Number(
            $("customerDue").value||0
        );

        const payment=Number(
            $("customerPayment").value||0
        );

        if(!date){

            alert("Date দিন");

            return;

        }

        if(!name){

            alert("Customer Name লিখুন");

            return;

        }

        if(due<0){

            alert("Opening Due সঠিকভাবে লিখুন");

            return;

        }

        if(payment<0){

            alert(
                "Payment / Collection সঠিকভাবে লিখুন"
            );

            return;

        }

        if(payment>due){

            alert(
                "Payment / Collection Opening Due-এর চেয়ে বেশি হতে পারবে না"
            );

            return;

        }

        const customer={

            id:id||Date.now().toString(),

            date:date,

            name:name,

            mobile:mobile,

            address:address,

            due:due,

            payment:payment,

            totalDue:Math.max(
                0,
                due-payment
            )

        };


        if(id){

            const index=db.customers.findIndex(
                c=>String(c.id)===String(id)
            );

            if(index!==-1){

                db.customers[index]=customer;

            }

        }else{

            db.customers.push(customer);

        }


        resetCustomerForm();

        save();

        alert(
            id
            ?"Customer Updated"
            :"Customer Saved"
        );

    }
);

/* =====================================================
   DATE RANGE
===================================================== */

function dateInRange(date,from,to){

    if(from && date<from){
        return false;
    }

    if(to && date>to){
        return false;
    }

    return true;

}


/* =====================================================
   DASHBOARD
===================================================== */

function calculateDashboard(){

    const sales=db.sales.reduce(
        (sum,s)=>
            sum+Number(s.total||0),
        0
    );

    const purchase=db.purchases.reduce(
        (sum,p)=>
            sum+Number(p.total||0),
        0
    );

    const gross=db.sales.reduce(
        (sum,s)=>
            sum+getSaleProfit(s),
        0
    );

    const expenses=db.expenses.reduce(
        (sum,e)=>
            sum+Number(e.amount||0),
        0
    );

    const net=gross-expenses;

    const salesDue=db.sales.reduce(
        (sum,s)=>
            sum+Number(s.due||0),
        0
    );

    const customerDue=db.customers.reduce(
        (sum,c)=>
            sum+
            Math.max(
                0,
                Number(c.totalDue??(
                    Number(c.due||0)-
                    Number(c.payment||0)
                ))
            ),
        0
    );

    const totalDue=
        salesDue+customerDue;

    const stockValue=db.products.reduce(
        (sum,p)=>
            sum+
            Number(p.stock||0)*
            Number(p.buy||0),
        0
    );

    const paidSales=db.sales.reduce(
        (sum,s)=>
            sum+Number(s.paid||0),
        0
    );

    const cash=
        paidSales-
        purchase-
        expenses;


    $("dashSales").innerText=
        money(sales);

    $("dashPurchase").innerText=
        money(purchase);

    $("dashGross").innerText=
        money(gross);

    $("dashExpense").innerText=
        money(expenses);

    $("dashNet").innerText=
        money(net);

    $("dashDue").innerText=
        money(totalDue);

    $("dashStock").innerText=
        money(stockValue);

    $("dashCash").innerText=
        money(cash);

    $("dashProducts").innerText=
        db.products.length;


    let recent="";

    [...db.sales]
        .reverse()
        .slice(0,10)
        .forEach(s=>{

            recent+=`

                <tr>

                    <td>
                        ${escapeHTML(s.date||"-")}
                    </td>

                    <td>
                        ${escapeHTML(s.product||"-")}
                    </td>

                    <td>
                        ${Number(s.qty||0)}
                        ${escapeHTML(s.unit||"পিস")}
                    </td>

                    <td>
                        ${money(s.total)}
                    </td>

                    <td>
                        ${money(s.paid)}
                    </td>

                    <td>
                        ${money(s.due)}
                    </td>

                </tr>

            `;

        });


    if(!recent){

        recent=`

            <tr>

                <td
                    colspan="6"
                    class="empty"
                >
                    কোনো Sale নেই
                </td>

            </tr>

        `;

    }

    $("recentSales").innerHTML=recent;

}

            sum+
            Number(p.stock||0)*
            Number(p.buy||0),
        0
    );


    const paidSales=sales.reduce(
        (sum,s)=>
            sum+Number(s.paid||0),
        0
    );

    const cash=
        paidSales-
        totalPurchase-
        totalExpense;


    $("reportSales").innerText=
        money(totalSales);

    $("reportPurchase").innerText=
        money(totalPurchase);

    $("reportGross").innerText=
        money(gross);

    $("reportExpense").innerText=
        money(totalExpense);

    $("reportNet").innerText=
        money(net);

    $("reportDue").innerText=
        money(totalDue);

    $("reportStock").innerText=
        money(stockValue);

    $("reportCash").innerText=
        money(cash);

    $("reportProducts").innerText=
        db.products.length;

}

function reportToday(){

}


function reportMonth(){

    const d=new Date();

    const year=d.getFullYear();

    const month=String(
        d.getMonth()+1
    ).padStart(2,"0");

    $("reportFrom").value=
        `${year}-${month}-01`;

    $("reportTo").value=
        today();

    generateReport();

}


function reportAll(){

    $("reportFrom").value="";

    $("reportTo").value="";

    generateReport();

}

function renderCustomers(){

    let html="";

    if(!db.customers.length){

        html=`

            <tr>

                <td
                    colspan="8"
                    class="empty"
                >
                    কোনো Customer নেই
                </td>

            </tr>

        `;

    }else{

        [...db.customers]
            .reverse()
            .forEach(c=>{

                const opening=
                    Number(c.due||0);

                const payment=
                    Number(c.payment||0);

                const due=
                    Number.isFinite(
                        Number(c.totalDue)
                    )
                    ?
                    Number(c.totalDue)
                    :
                    Math.max(
                        0,
                        opening-payment
                    );

                html+=`

                    <tr>

                        <td>

                                c.date||"-"

                        <td>

                                c.address||"-"
                            )}
                        </td>

                        <td>
                            ${money(opening)}

                        </td>

                        <td>
