   SMART STORE MANAGEMENT

========================================================= */

} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  deleteDoc,
  collection,
  getDocs,
  writeBatch
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================================================
   ⚠️ IMPORTANT
   এখানে তোমার Firebase Web App Config বসাতে হবে
========================================================= */

const firebaseConfig = {

  apiKey: "YOUR_FIREBASE_API_KEY",

  authDomain: "YOUR_FIREBASE_AUTH_DOMAIN",

  projectId: "YOUR_FIREBASE_PROJECT_ID",

  storageBucket: "YOUR_FIREBASE_STORAGE_BUCKET",

  messagingSenderId: "YOUR_FIREBASE_MESSAGING_SENDER_ID",

  appId: "YOUR_FIREBASE_APP_ID"

};


/* =========================================================
   INITIALIZE FIREBASE
========================================================= */

let firebaseApp;
let auth;
let db;

try {

  if (
    firebaseConfig.apiKey === "YOUR_FIREBASE_API_KEY" ||
    firebaseConfig.projectId === "YOUR_FIREBASE_PROJECT_ID"
  ) {

    throw new Error(
      "Firebase Config বসানো হয়নি। Firebase Console থেকে Web App Config কপি করে firebaseConfig-এ বসান।"
    );

  }

  firebaseApp = initializeApp(firebaseConfig);

  auth = getAuth(firebaseApp);

  db = getFirestore(firebaseApp);

} catch (error) {

  console.error("Firebase initialization error:", error);

  document.getElementById("loading").style.display = "none";

  document.getElementById("message").textContent =
    "Firebase setup সমস্যা: " + error.message;

  document.getElementById("message").style.color = "#dc2626";

}


/* =========================================================
   GLOBAL DATA
========================================================= */

let currentUser = null;

let products = [];
let sales = [];
let purchases = [];
let expenses = [];
let duePayments = [];

let settings = {

  name: "Smart Store",
  owner: "",
  address: "",
  phone: ""

};

let saleRowCounter = 0;

let selectedDueCustomer = "";


/* =========================================================
   HELPERS
========================================================= */

function uid() {

  return Date.now().toString(36) +
    Math.random().toString(36).substring(2) +
    Math.random().toString(36).substring(2);

}


function money(n) {

  return "৳" +
    Number(n || 0).toLocaleString("en-BD", {

      minimumFractionDigits: 2,
      maximumFractionDigits: 2

    });

}


function today() {

  return new Date().toISOString().split("T")[0];

}


function escapeHtml(str) {

  return String(str ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function showLoading(text = "Please wait...") {

  document.querySelector("#loading div").innerHTML =
    "⏳ " + escapeHtml(text);

  document.getElementById("loading").style.display = "flex";

}


function hideLoading() {

  document.getElementById("loading").style.display = "none";

}


function showMessage(text, type = "error") {

  const box = document.getElementById("message");

  box.textContent = text;

  box.style.color =
    type === "success"
      ? "#16a34a"
      : "#dc2626";

}


/* =========================================================
   FIREBASE ERROR
========================================================= */

function firebaseError(error) {

  console.error(error);

  switch (error?.code) {

    case "auth/invalid-email":
      return "Email address সঠিক নয়।";

    case "auth/user-not-found":
      return "এই email দিয়ে কোনো account পাওয়া যায়নি।";

    case "auth/wrong-password":
      return "Password ভুল।";

    case "auth/invalid-credential":
      return "Email অথবা Password ভুল।";

    case "auth/email-already-in-use":
      return "এই email দিয়ে account আগে থেকেই আছে।";

    case "auth/weak-password":
      return "Password কমপক্ষে 6 characters হতে হবে।";

    case "auth/too-many-requests":
      return "অনেকবার চেষ্টা করা হয়েছে। কিছুক্ষণ পরে আবার চেষ্টা করুন।";

    case "auth/network-request-failed":
      return "Internet connection পরীক্ষা করুন।";

    case "auth/user-disabled":
      return "এই account disabled করা হয়েছে।";

    case "auth/api-key-not-valid":
      return "Firebase API Key সঠিক নয়। Firebase Console থেকে Web App Config কপি করুন।";

    case "permission-denied":
      return "Firestore permission denied। Firebase Security Rules পরীক্ষা করুন।";

    case "failed-precondition":
      return "Firestore Database setup সম্পূর্ণ হয়নি। Firebase Console থেকে Firestore Database তৈরি করুন।";

    default:
      return error?.message || "একটি সমস্যা হয়েছে। আবার চেষ্টা করুন।";

  }

}


/* =========================================================
   FIRESTORE REFERENCES
========================================================= */

function userDoc() {

  return doc(
    db,
    "users",
    currentUser.uid
  );

}


function userCollection(name) {

  return collection(
    db,
    "users",
    currentUser.uid,
    name
  );

}


function userCollectionDoc(name, id) {

  return doc(
    db,
    "users",
    currentUser.uid,
    name,
    String(id)
  );

}


/* =========================================================
   CHUNKED FIRESTORE BATCH
   500 operation limit-এর সমস্যা এড়ানোর জন্য
========================================================= */

async function commitOperations(operations) {

  const CHUNK_SIZE = 450;

  for (
    let start = 0;
    start < operations.length;
    start += CHUNK_SIZE
  ) {

    const chunk =
      operations.slice(
        start,
        start + CHUNK_SIZE
      );

    const batch = writeBatch(db);

    chunk.forEach(op => {

      if (op.type === "delete") {

        batch.delete(op.ref);

      } else {

        batch.set(
          op.ref,
          op.data,
          op.options || {}
        );

      }

    });

    await batch.commit();

  }

}


/* =========================================================
   SAVE ALL DATA
========================================================= */

async function saveAllData() {

  if (!currentUser) {

    throw new Error("User login করা নেই।");

  }

  const operations = [];


  /* -----------------------------------------
     USER PROFILE
  ----------------------------------------- */

  operations.push({

    type: "set",

    ref: userDoc(),

    data: {

      name:
        currentUser.displayName ||
        settings.owner ||
        "User",

      email:
        currentUser.email || "",

      updatedAt:
        new Date().toISOString()

    },

    options: {
      merge: true
    }

  });


  /* -----------------------------------------
     SETTINGS
  ----------------------------------------- */

  operations.push({

    type: "set",

    ref: doc(
      db,
      "users",
      currentUser.uid,
      "settings",
      "main"
    ),

    data: settings,

    options: {
      merge: true
    }

  });


  /* -----------------------------------------
     COLLECTION SAVE
  ----------------------------------------- */

  const collectionsData = {

    products,
    sales,
    purchases,
    expenses,
    duePayments

  };


  for (
    const [collectionName, items]
    of Object.entries(collectionsData)
  ) {

    const ref =
      userCollection(collectionName);

    const oldSnapshot =
      await getDocs(ref);


    const currentIds =
      new Set(
        items.map(item => String(item.id))
      );


    /* Delete documents that no longer exist */

    oldSnapshot.docs.forEach(d => {

      if (!currentIds.has(d.id)) {

        operations.push({

          type: "delete",

          ref: d.ref

        });

      }

    });


    /* Save current documents */

    items.forEach(item => {

      if (!item.id) {

        item.id = uid();

      }


      operations.push({

        type: "set",

        ref: userCollectionDoc(
          collectionName,
          item.id
        ),

        data: item

      });

    });

  }


  await commitOperations(operations);

}


/* =========================================================
   LOAD COLLECTION
========================================================= */

async function loadCollection(name) {

  const snap =
    await getDocs(
      userCollection(name)
    );


  return snap.docs.map(d => ({

    id: d.id,

    ...d.data()

  }));

}


/* =========================================================
   LOAD ACCOUNT DATA
========================================================= */

async function loadAccountData() {

  if (!currentUser) return;

  showLoading(
    "Loading your store data..."
  );


  try {

    /* User profile */

    const profileSnap =
      await getDoc(userDoc());


    if (!profileSnap.exists()) {

      await setDoc(

        userDoc(),

        {

          name:
            currentUser.displayName ||
            "User",

          email:
            currentUser.email || "",

          createdAt:
            new Date().toISOString(),

          updatedAt:
            new Date().toISOString()

        },

        {
          merge: true
        }

      );

    }


    /* Settings */

    const settingsSnap =
      await getDoc(

        doc(
          db,
          "users",
          currentUser.uid,
          "settings",
          "main"
        )

      );


    if (settingsSnap.exists()) {

      settings = {

        name: "Smart Store",
        owner: "",
        address: "",
        phone: "",

        ...settingsSnap.data()

      };

    } else {

      settings = {

        name: "Smart Store",

        owner:
          currentUser.displayName || "",

        address: "",

        phone: ""

      };

    }


    /* Load all */

    products =
      await loadCollection("products");

    sales =
      await loadCollection("sales");

    purchases =
      await loadCollection("purchases");

    expenses =
      await loadCollection("expenses");

    duePayments =
      await loadCollection("duePayments");


    hideLoading();


  } catch (error) {

    hideLoading();

    console.error(
      "Load data error:",
      error
    );

    throw error;

  }

}

/* =========================================================
   CREATE ACCOUNT
========================================================= */

async function createAccount() {

  const name =
    document.getElementById(
      "createName"
    ).value.trim();

  const email =
    document.getElementById(
      "createEmail"
    ).value.trim().toLowerCase();

  const password =
    document.getElementById(
      "createPassword"
    ).value;

  const password2 =
    document.getElementById(
      "createPassword2"
    ).value;


  if (!name || !email || !password) {

    showMessage(
      "সব তথ্য পূরণ করুন।"
    );

    return;

  }


  if (password.length < 6) {

    showMessage(
      "Password কমপক্ষে 6 characters হতে হবে।"
    );

    return;

  }


  if (password !== password2) {

    showMessage(
      "Password মিলছে না।"
    );

    return;

  }


  showLoading(
    "Creating your account..."
  );


  try {

    const credential =
      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );


    currentUser =
      credential.user;


    /* Firebase display name */

    await updateProfile(

      currentUser,

      {
        displayName: name
      }

    );


    /* User document */

    await setDoc(

      userDoc(),

      {

        name: name,

        email: email,

        createdAt:
          new Date().toISOString(),

        updatedAt:
          new Date().toISOString()

      },

      {
        merge: true
      }

    );


    /* Default settings */

    settings = {

      name: "Smart Store",

      owner: name,

      address: "",

      phone: ""

    };


    await setDoc(

      doc(
        db,
        "users",
        currentUser.uid,
        "settings",
        "main"
      ),

      settings

    );


    /* Verification */

    try {

      await sendEmailVerification(
        currentUser
      );

    } catch (verificationError) {

      console.warn(
        "Verification email error:",
        verificationError
      );

    }


    hideLoading();


    alert(
      "Account successfully created!\n\n" +
      "Verification email আপনার email-এ পাঠানো হয়েছে।"
    );


    await loadAccountData();

    openApp();


  } catch (error) {

    hideLoading();

    showMessage(
      firebaseError(error)
    );

  }

}

   LOGIN
========================================================= */

  const email =
    document.getElementById(
      "loginEmail"
    ).value.trim().toLowerCase();

  const password =
    document.getElementById(
      "loginPassword"
    ).value;


  if (!email || !password) {

    showMessage(
      "Email এবং Password দিন।"
    );

    return;

  }


  showLoading(
    "Logging in..."
  );


  try {

    const credential =
      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );


    currentUser =
      credential.user;


    await loadAccountData();


    hideLoading();

    openApp();


  } catch (error) {

    hideLoading();

    showMessage(
      firebaseError(error)
    );

  }

}

/* =========================================================
   PRODUCTS
========================================================= */

async function addProduct() {

  const name =
    document.getElementById(
      "productName"
    ).value.trim();


  if (!name) {

    alert(
      "Product name দিন।"
    );

    return;

  }


  let code =
    document.getElementById(
      "productCode"
    ).value.trim();


  if (!code) {

    code = "P" + Date.now();

  }


  if (
    products.some(
      p =>
        String(p.code || "")
          .toLowerCase() ===
        code.toLowerCase()
    )
  ) {

    alert(
      "এই Product Code আগে থেকেই আছে।"
    );

    return;

  }


  const product = {

    id: uid(),

    name,

    code,

    category:
      document.getElementById(
        "productCategory"
      ).value.trim(),

    purchasePrice:
      Number(
        document.getElementById(
          "purchasePrice"
        ).value
      ) || 0,

    sellingPrice:
      Number(
        document.getElementById(
          "sellingPrice"
        ).value
      ) || 0,

    stock:
      Number(
        document.getElementById(
          "productStock"
        ).value
      ) || 0,

    unit:
      document.getElementById(
        "productUnit"
      ).value.trim() || "pcs",

    minStock:
      Number(
        document.getElementById(
          "minStock"
        ).value
      ) || 0

  };


  products.push(product);


  try {

    await saveAllData();

    clearProductForm();

    renderAll();

    alert(
      "Product added successfully!"
    );


  } catch (error) {

    products =
      products.filter(
        p => p.id !== product.id
      );

    alert(
      "Product save করতে সমস্যা হয়েছে:\n\n" +
      firebaseError(error)
    );

  }

}


function clearProductForm() {

  [
    "productName",
    "productCode",
    "productCategory",
    "purchasePrice",
    "sellingPrice",
    "productStock",
    "productUnit",
    "minStock"
  ].forEach(id => {

    document.getElementById(id).value = "";

  });

}


function renderProducts() {

  const search =
    document.getElementById(
      "productSearch"
    )?.value.toLowerCase() || "";


  const list =
    products.filter(p =>

      String(p.name || "")
        .toLowerCase()
        .includes(search)

      ||

      String(p.code || "")
        .toLowerCase()
        .includes(search)

      ||

      String(p.category || "")
        .toLowerCase()
        .includes(search)

    );


  document.getElementById(
    "productTable"
  ).innerHTML =

    list.map(p => `

      <tr>

        <td>
          ${p.migrated ? "🔄 " : ""}
          ${escapeHtml(p.name)}
        </td>

        <td>
          ${escapeHtml(p.code)}
        </td>

        <td>
          ${escapeHtml(p.category)}
        </td>

        <td>
          ${money(p.purchasePrice)}
        </td>

        <td>
          ${money(p.sellingPrice)}
        </td>

        <td class="${
          Number(p.stock) <= Number(p.minStock)
            ? "lowStock"
            : "goodStock"
        }">
          ${p.stock}
        </td>

        <td>
          ${escapeHtml(p.unit)}
        </td>

        <td>

          <button
            onclick="editProduct('${p.id}')">
            ✏️
          </button>

          <button
            class="btnRed"
            onclick="deleteProduct('${p.id}')">
            🗑️
          </button>

          <button
            class="btnDark"
            onclick="showBarcode('${p.id}')">
            ▣
          </button>

        </td>

      </tr>

    `).join("");

}


async function editProduct(id) {

  const product =
    products.find(
      p => p.id === id
    );


  if (!product) return;


  const price =
    prompt(
      "নতুন Selling Price:",
      product.sellingPrice
    );


  if (price === null) return;


  const oldPrice =
    product.sellingPrice;


  const newPrice =
    Number(price);


  if (
    !Number.isFinite(newPrice) ||
    newPrice < 0
  ) {

    alert(
      "সঠিক Selling Price দিন।"
    );

    return;

  }


  product.sellingPrice =
    newPrice;


  try {

    await saveAllData();

    renderAll();


  } catch (error) {

    product.sellingPrice =
      oldPrice;

    alert(
      "Update করতে সমস্যা হয়েছে:\n\n" +
      firebaseError(error)
    );

  }

}


async function deleteProduct(id) {

  if (
    !confirm(
      "Product delete করবেন?"
    )
  ) return;


  const old =
    [...products];


  products =
    products.filter(
      p => p.id !== id
    );


  try {

    await saveAllData();

    renderAll();


  } catch (error) {

    products = old;

    alert(
      "Delete করতে সমস্যা হয়েছে:\n\n" +
      firebaseError(error)
    );

  }

}


/* =========================================================
   BARCODE
========================================================= */

function showBarcode(id) {

  const product =
    products.find(
      p => p.id === id
    );


  if (!product) return;


  document.getElementById(
    "barcodeModal"
  ).style.display = "flex";

function findProduct(text) {

  const value =
    String(text || "")
      .trim()
      .toLowerCase();


  return products.find(p =>

    String(p.name || "")
      .toLowerCase() === value

    ||

    String(p.code || "")
      .toLowerCase() === value

  );

}


function saleProductChanged(id) {

  const row =
    document.getElementById(
      "saleRow_" + id
    );


  if (!row) return;


  const input =
    row.querySelector(
      ".saleProduct"
    );


  const product =
    findProduct(
      input.value
    );


  row.querySelector(
    ".salePrice"
  ).value =

    product
      ? product.sellingPrice
      : "";


  calculateSale();

}


function calculateSale() {

  let total = 0;


  document.querySelectorAll(
    ".saleRow"
  ).forEach(row => {

    const qty =
      Number(
        row.querySelector(
          ".saleQty"
        ).value
      ) || 0;


    const price =
      Number(
        row.querySelector(
          ".salePrice"
        ).value
      ) || 0;


    const subtotal =
      qty * price;


    row.querySelector(
      ".saleSubtotal"
    ).value =
      subtotal.toFixed(2);


    total += subtotal;

  });


  document.getElementById(
    "saleTotal"
  ).value =
    total.toFixed(2);


  const paid =
    Number(
      document.getElementById(
        "salePaid"
      ).value
    ) || 0;


  document.getElementById(
    "saleDue"
  ).value =
    Math.max(
      0,
      total - paid
    ).toFixed(2);

}


/* =========================================================
   COMPLETE SALE
========================================================= */

async function completeSale() {

  const rows =
    [
      ...document.querySelectorAll(
        ".saleRow"
      )
    ];


  if (!rows.length) {

    alert(
      "কমপক্ষে একটি product যোগ করুন।"
    );

    return;

  }


  const items = [];


  for (const row of rows) {

    const input =
      row.querySelector(
        ".saleProduct"
      );


    const product =
      findProduct(
        input.value
      );


    const qty =
      Number(
        row.querySelector(
          ".saleQty"
        ).value
      ) || 0;


    if (!product) {

      alert(
        "Product পাওয়া যায়নি: " +
        input.value
      );

      return;

    }


    if (qty <= 0) {

      alert(
        "Quantity সঠিক দিন।"
      );

      return;

    }


    if (
      product.stock < qty
    ) {

      alert(
        product.name +
        " এর stock পর্যাপ্ত নেই। Current stock: " +
        product.stock
      );

      return;

    }


    items.push({

      productId:
        product.id,

      name:
        product.name,

      code:
        product.code,

      qty,

      price:
        product.sellingPrice,

      purchasePrice:
        product.purchasePrice,

      subtotal:
        qty *
        product.sellingPrice

    });

  }


  const total =
    items.reduce(
      (sum, item) =>
        sum + item.subtotal,
      0
    );


  const paid =
    Number(
      document.getElementById(
        "salePaid"
      ).value
    ) || 0;


  if (paid > total) {

    alert(
      "Paid amount total-এর চেয়ে বেশি হতে পারবে না।"
    );

    return;

  }


  const sale = {

    id: uid(),

    invoice:
      "INV-" +
      Date.now(),

    date:
      document.getElementById(
        "saleDate"
      ).value ||
      today(),

    customer:
      document.getElementById(
        "saleCustomer"
      ).value.trim() ||
      "Walk-in Customer",

    payment:
      document.getElementById(
        "salePayment"
      ).value.trim() ||
      "Cash",

    items,

    total,

    paid,

    due:
      total - paid

  };


  /* Backup stock */

  const stockBackup =
    items.map(item => {

      const p =
        products.find(
          x =>
            x.id ===
            item.productId
        );

      return {

        id:
          item.productId,

        stock:
          p?.stock

      };

    });


  /* Reduce stock */

  items.forEach(item => {

    const p =
      products.find(
        x =>
          x.id ===
          item.productId
      );


    if (p) {

      p.stock -=
        item.qty;

    }

  });


  sales.push(sale);


  showLoading(
    "Saving sale..."
  );


  try {

    await saveAllData();

    hideLoading();


    printInvoiceForSale(
      sale
    );


    document.getElementById(
      "saleRows"
    ).innerHTML = "";


    document.getElementById(
      "salePaid"
    ).value = "";


    document.getElementById(
      "saleCustomer"
    ).value = "";


    document.getElementById(
      "salePayment"
    ).value = "";


    document.getElementById(
      "saleTotal"
    ).value = "0";


    document.getElementById(
      "saleDue"
    ).value = "0";


    addSaleRow();

    renderAll();


  } catch (error) {

    /* Rollback sale */

    sales =
      sales.filter(
        s =>
          s.id !==
          sale.id
      );


    stockBackup.forEach(
      backup => {

        const p =
          products.find(
            x =>
              x.id ===
              backup.id
          );


        if (p) {

          p.stock =
            backup.stock;

        }

      }
    );


    hideLoading();


    alert(
      "Sale save করতে সমস্যা হয়েছে:\n\n" +
      firebaseError(error)
    );

  }

}


async function deleteSale(id) {

  const sale =
    sales.find(
      s => s.id === id
    );


  if (!sale) return;


  if (
    !confirm(
      "Sale delete করবেন?\n\nStock আবার যোগ হবে।"
    )
  ) return;


  const oldSales =
    [...sales];


  const stockBackup =
    sale.items.map(
      item => {

        const p =
          products.find(
            x =>
              x.id ===
              item.productId
          );

        return {

          id:
            item.productId,

          stock:
            p?.stock

        };

      }
    );


  /* Restore stock */

  sale.items.forEach(
    item => {

      const p =
        products.find(
          x =>
            x.id ===
            item.productId
        );


      if (p) {

        p.stock +=
          Number(item.qty) || 0;

      }

    }
  );


  sales =
    sales.filter(
      s => s.id !== id
    );


  showLoading(
    "Deleting sale..."
  );


  try {

    await saveAllData();

    hideLoading();

    renderAll();


  } catch (error) {

    sales = oldSales;


    stockBackup.forEach(
      backup => {

        const p =
          products.find(
            x =>
              x.id ===
              backup.id
          );


        if (p) {

          p.stock =
            backup.stock;

        }

      }
    );


    hideLoading();


    alert(
      "Delete করতে সমস্যা হয়েছে:\n\n" +
      firebaseError(error)
    );

  }

}

function getCustomerData() {

  const map = {};


  sales.forEach(s => {

    const name =
      s.customer ||
      "Walk-in Customer";


    if (!map[name]) {

      map[name] = {

        name,

        total: 0,

        paid: 0,

        originalDue: 0

      };

    }


    map[name].total +=
      Number(s.total) || 0;


    map[name].paid +=
      Number(s.paid) || 0;


    map[name].originalDue +=
      Number(s.due) || 0;

  });


  duePayments.forEach(p => {

    const name =
      p.customer;


    if (!map[name]) {

      map[name] = {

        name,

        total: 0,

        paid: 0,

        originalDue: 0

      };

    }


    map[name].paid +=
      Number(p.amount) || 0;

  });


  Object.values(map)
    .forEach(c => {

      c.due =
        Math.max(
          0,
          c.total - c.paid
        );

    });


  return Object.values(map);

}

  const data =

/* =========================================================
   TOTALS
========================================================= */

function getTotals() {

  const totalSales =
    sales.reduce(
      (sum, s) =>
        sum +
        (Number(s.total) || 0),
      0
    );


  const totalPurchase =
    purchases.reduce(
      (sum, p) =>
        sum +
        (Number(p.total) || 0),
      0
    );


  const totalExpense =
    expenses.reduce(
      (sum, e) =>
        sum +
        (Number(e.amount) || 0),
      0
    );


  const grossProfit =
    sales.reduce(
      (sum, s) => {

        const profit =
          (s.items || [])
            .reduce(
              (a, i) =>

                a +

                (
                  (Number(i.price) || 0) -
                  (Number(i.purchasePrice) || 0)
                ) *

                (Number(i.qty) || 0),

              0
            );


        return sum + profit;

      },

      0
    );


  const due =
    getCustomerData()
      .reduce(
        (sum, c) =>
          sum + c.due,
        0
      );


  const stockValue =
    products.reduce(
      (sum, p) =>

        sum +

        (Number(p.stock) || 0) *

        (Number(p.purchasePrice) || 0),

      0
    );


  return {

    totalSales,

    totalPurchase,

    totalExpense,

    grossProfit,

    due,

    stockValue,

    netProfit:
      grossProfit -

  };


  const blob =
    new Blob(

      [
        JSON.stringify(
          backup,
          null,
          2
        )
      ],

      {
        type:
          "application/json"
      }

    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      "a"
    );


  a.href = url;


  a.download =
    "smart-store-backup-" +
    today() +
    ".json";


  document.body.appendChild(a);

  a.click();

  a.remove();


  URL.revokeObjectURL(url);

}


/* =========================================================
   RESTORE
========================================================= */

async function restoreData(event) {

  const file =
    event.target.files[0];


  if (!file) return;


  const reader =
    new FileReader();


  reader.onload =
    async function(e) {

      try {

        const backup =
          JSON.parse(
            e.target.result
          );


        const data =
          backup.data ||
          backup;


        if (!data) {

          throw new Error(
            "Invalid backup file."
          );

        }


        if (
          !confirm(
            "বর্তমান Firebase data replace করে backup restore করবেন?"
          )
        ) {

          event.target.value = "";

          return;

        }


        products =
          Array.isArray(
            data.products
          )
            ? data.products
            : [];


        sales =
          Array.isArray(
            data.sales
          )
            ? data.sales
            : [];


        purchases =
          Array.isArray(
            data.purchases
          )
            ? data.purchases
            : [];


        expenses =
          Array.isArray(
            data.expenses
          )
            ? data.expenses
            : [];


        duePayments =
          Array.isArray(
            data.duePayments
          )
            ? data.duePayments
            : [];


        settings = {

          name: "Smart Store",
          owner: "",
          address: "",
          phone: "",

          ...(data.settings || {})

        };


        showLoading(
          "Restoring backup..."
        );


        await saveAllData();


        hideLoading();


        loadSettings();

        renderAll();


        alert(
          "Backup successfully restored!"
        );


      } catch (error) {

        hideLoading();

        console.error(error);


        alert(
          "Backup restore করা যায়নি:\n\n" +
          firebaseError(error)
        );

      }


      event.target.value = "";

    };


  reader.readAsText(file);

}


/* =========================================================
   DELETE ACCOUNT
========================================================= */

async function deleteCurrentAccount() {

  if (!currentUser) {

    alert(
      "আগে Login করুন।"
    );

    return;

  }


  if (
    !confirm(

      "আপনার Firebase Account এবং এই account-এর সব store data delete হয়ে যাবে।\n\n" +
      "এই কাজটি undo করা যাবে না।\n\n" +
      "Continue?"

    )
  ) return;


  const confirmation =
    prompt(
      "নিশ্চিত করতে DELETE লিখুন:"
    );


  if (
    confirmation !==
    "DELETE"
  ) {

    alert(
      "Account delete করা হয়নি।"
    );

    return;

  }


  showLoading(
    "Deleting account..."
  );


  try {

    const collections = [

      "products",
      "sales",
      "purchases",
      "expenses",
      "duePayments",
      "settings"

    ];


    /* Collect all delete operations */

    const operations = [];


    for (
      const collectionName
      of collections
    ) {

      const snap =
        await getDocs(

          collection(
            db,
            "users",
            currentUser.uid,
            collectionName
          )

        );


      snap.docs.forEach(
        d => {

          operations.push({

            type: "delete",

            ref: d.ref

          });

        }
      );

    }


    /* Delete subcollections */

    await commitOperations(
      operations
    );


    /* Delete main user document */

    await deleteDoc(
      userDoc()
    );


    /* Delete Auth account */

    await deleteUser(
      currentUser
    );


    hideLoading();


    alert(
      "Account successfully deleted."
    );


    location.reload();


  } catch (error) {

    hideLoading();


    console.error(error);


    /*
      Firebase account delete করার সময়
      recent login লাগতে পারে।
    */

    if (
      error.code ===
      "auth/requires-recent-login"
    ) {

      alert(
        "Security-এর জন্য আবার Login করে তারপর Account Delete করুন।"
      );

    } else {

      alert(
        "Account delete করতে সমস্যা হয়েছে:\n\n" +
        firebaseError(error)
      );

    }

  }

}


/* =========================================================
   OLD LOCALSTORAGE MIGRATION
========================================================= */

function safeJson(key, fallback = []) {

  try {

    const value =
      localStorage.getItem(key);


    if (!value) {

      return fallback;

    }


    return JSON.parse(value);

  } catch {

    return fallback;

  }

}


function hasLegacyData() {

  const p =
    safeJson(
      "products",
      []
    );


  const s =
    safeJson(
      "sales",
      []
    );


  const pu =
    safeJson(
      "purchases",
      []
    );


  const e =
    safeJson(
      "expenses",
      []
    );


  return (
    p.length ||
    s.length ||
    pu.length ||
    e.length
  );

}


function stableHash(str) {

  let h = 0;


  for (
    let i = 0;
    i < str.length;
    i++
  ) {

    h =
      ((h << 5) - h) +
      str.charCodeAt(i);

    h |= 0;

  }


  return Math.abs(h)
    .toString(36);

}


function migrationKey(
  type,
  obj
) {

  if (
    obj &&
    obj.id !== undefined &&
    obj.id !== null
  ) {

    return (
      type +
      "_" +
      String(obj.id)
    );

  }


  const copy = {
    ...(obj || {})
  };


  delete copy.migrated;

  delete copy.migratedAt;

  delete copy.oldMigrationId;


  return (
    type +
    "_" +
    stableHash(
      JSON.stringify(copy)
    )
  );

}


/* =========================================================
   MIGRATION
========================================================= */

async function migrateOldData(
  showAlert = false
) {

  if (!currentUser) {

    if (showAlert) {

      alert(
        "আগে Login করুন।"
      );

    }

    return false;

  }


  const oldProducts =
    safeJson(
      "products",
      []
    );


  const oldSales =
    safeJson(
      "sales",
      []
    );


  const oldPurchases =
    safeJson(
      "purchases",
      []
    );


  const oldExpenses =
    safeJson(
      "expenses",
      []
    );


  const oldSettings =
    safeJson(
      "storeSettings",
      null
    );


  const hasOld =

    oldProducts.length ||
    oldSales.length ||
    oldPurchases.length ||
    oldExpenses.length;


  if (!hasOld) {

    if (showAlert) {

      alert(
        "পুরোনো data পাওয়া যায়নি।"
      );

    }

    return false;

  }


  /* Existing migration keys */

  const existingKeys =
    new Set();


  [
    ...products,
    ...sales,
    ...purchases,
    ...expenses
  ].forEach(item => {

    if (
      item.oldMigrationId
    ) {

      existingKeys.add(
        item.oldMigrationId
      );

    }

  });


  /*
    Product ID mapping

    পুরোনো product ID →
    নতুন Firebase product ID
  */

  const productIdMap =
    new Map();


  const migratedProducts = [];

  const migratedSales = [];

  const migratedPurchases = [];

  const migratedExpenses = [];


  /* -----------------------------------------
     PRODUCTS
  ----------------------------------------- */

  oldProducts.forEach(oldProduct => {

    const key =
      migrationKey(
        "product",
        oldProduct
      );


    if (
      existingKeys.has(key)
    ) return;


    const newId =
      uid();


    productIdMap.set(
      String(oldProduct.id),
      newId
    );


    migratedProducts.push({

      ...oldProduct,

      id: newId,

      migrated: true,

      migratedAt:
        new Date().toISOString(),

      oldMigrationId:
        key

    });


    existingKeys.add(key);

  });


  /* -----------------------------------------
     SALES
  ----------------------------------------- */

  oldSales.forEach(oldSale => {

    const key =
      migrationKey(
        "sale",
        oldSale
      );


    if (
      existingKeys.has(key)
    ) return;


    const newItems =
      (oldSale.items || [])
        .map(item => ({

          ...item,

          productId:
            productIdMap.get(
              String(
                item.productId
              )
            ) ||
            item.productId

        }));


    migratedSales.push({

      ...oldSale,

      id: uid(),

      items: newItems,

      migrated: true,

      migratedAt:
        new Date().toISOString(),

      oldMigrationId:
        key

    });


    existingKeys.add(key);

  });


  /* -----------------------------------------
     PURCHASES
  ----------------------------------------- */

  oldPurchases.forEach(oldPurchase => {

    const key =
      migrationKey(
        "purchase",
        oldPurchase
      );


    if (
      existingKeys.has(key)
    ) return;


    migratedPurchases.push({

      ...oldPurchase,

      id: uid(),

      productId:
        productIdMap.get(
          String(
            oldPurchase.productId
          )
        ) ||
        oldPurchase.productId,

      migrated: true,

      migratedAt:
        new Date().toISOString(),

      oldMigrationId:
        key

    });


    existingKeys.add(key);

  });


  /* -----------------------------------------
     EXPENSES
  ----------------------------------------- */

  oldExpenses.forEach(oldExpense => {

    const key =
      migrationKey(
        "expense",
        oldExpense
      );


    if (
      existingKeys.has(key)
    ) return;


    migratedExpenses.push({

      ...oldExpense,

      id: uid(),

      migrated: true,

      migratedAt:
        new Date().toISOString(),

      oldMigrationId:
        key

    });


    existingKeys.add(key);

  });


  products = [

    ...products,

    ...migratedProducts

  ];


  sales = [

    ...sales,

    ...migratedSales

  ];


  purchases = [

    ...purchases,

    ...migratedPurchases

  ];


  expenses = [

    ...expenses,

    ...migratedExpenses

  ];


  if (oldSettings) {

    settings = {

      ...settings,

      ...oldSettings

    };

  }


  showLoading(
    "Migrating old data to Firebase..."
  );


  try {

    await saveAllData();


    hideLoading();


    loadSettings();

    renderAll();


    const message =

      "Migration complete: " +

      migratedProducts.length +
      " Products, " +

      migratedSales.length +
      " Sales, " +

      migratedPurchases.length +
      " Purchases, " +

      migratedExpenses.length +
      " Expenses.";


    document.getElementById(
      "migrationResult"
    ).textContent =
      message;


    if (showAlert) {

      alert(message);

    }


    return true;


  } catch (error) {

    hideLoading();


    alert(
      "Migration failed:\n\n" +
      firebaseError(error)
    );


    await loadAccountData();

    renderAll();


    return false;

  }

}
