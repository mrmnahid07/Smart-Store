<script type="module"> /* ========================================================= FIREBASE ========================================================= */ import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js"; import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail, sendEmailVerification, updateProfile, onAuthStateChanged, deleteUser, signOut } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js"; import { getFirestore, doc, getDoc, setDoc, deleteDoc, collection, getDocs, writeBatch } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js"; /* ========================================================= 🔥 YOUR FIREBASE CONFIG এখানে নিজের Firebase config বসাও ========================================================= */ const firebaseConfig = { apiKey: "YOUR_FIREBASE_API_KEY", authDomain: "YOUR_PROJECT.firebaseapp.com", projectId: "YOUR_PROJECT_ID", storageBucket: "YOUR_PROJECT.firebasestorage.app", messagingSenderId: "YOUR_MESSAGING_SENDER_ID", appId: "YOUR_FIREBASE_APP_ID" }; const firebaseApp = initializeApp(firebaseConfig); const auth = getAuth(firebaseApp); const db = getFirestore(firebaseApp); /* ========================================================= GLOBAL DATA ========================================================= */ let products = []; let sales = []; let purchases = []; let expenses = []; let duePayments = []; let settings = { name: "Smart Store", owner: "", address: "", phone: "" }; let saleRowCounter = 0; let selectedDueCustomer = ""; /* ========================================================= HELPERS ========================================================= */ function uid(){ return Date.now().toString(36) + Math.random().toString(36).substring(2); } function money(n){ return "৳" + Number(n || 0).toLocaleString("en-BD", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); } function today(){ return new Date().toISOString().split("T")[0]; } function escapeHtml(str){ return String(str ?? "") .replace(/&/g,"&amp;") .replace(/</g,"&lt;") .replace(/>/g,"&gt;") .replace(/"/g,"&quot;") .replace(/'/g,"&#039;"); } /* ========================================================= FIRESTORE REFERENCES ========================================================= */ function userRef(){ return doc(db,"users",auth.currentUser.uid); } function collectionRef(name){ return collection( db, "users", auth.currentUser.uid, name ); } function documentRef(name,id){ return doc( db, "users", auth.currentUser.uid, name, id ); } /* ========================================================= ACCOUNT UI ========================================================= */ function showCreateAccount(){ document.getElementById("loginForm").style.display="none"; document.getElementById("createForm").style.display="block"; document.getElementById("forgotForm").style.display="none"; } function showLogin(){ document.getElementById("loginForm").style.display="block"; document.getElementById("createForm").style.display="none"; document.getElementById("forgotForm").style.display="none"; document.getElementById("codeSection").style.display="none"; } function showForgotPassword(){ document.getElementById("loginForm").style.display="none"; document.getElementById("createForm").style.display="none"; document.getElementById("forgotForm").style.display="block"; } /* ========================================================= CREATE ACCOUNT ========================================================= */ async function createAccount(){ const name = document.getElementById("createName").value.trim(); const email = document.getElementById("createEmail").value.trim().toLowerCase(); const pass = document.getElementById("createPassword").value; const pass2 = document.getElementById("createPassword2").value; if(!name || !email || !pass){ alert("সব তথ্য পূরণ করুন।"); return; } if(pass.length < 6){ alert("Firebase অনুযায়ী Password কমপক্ষে 6 characters হতে হবে।"); return; } if(pass !== pass2){ alert("Password মিলছে না।"); return; } try{ const result = await createUserWithEmailAndPassword( auth, email, pass ); const user = result.user; await updateProfile(user,{ displayName:name }); await setDoc( userRef(), { uid:user.uid, name:name, email:email, createdAt:new Date().toISOString() } ); await setDoc( doc( db, "users", user.uid, "settings", "main" ), { name:"Smart Store", owner:name, address:"", phone:"" } ); try{ await sendEmailVerification(user); }catch(e){ console.log("Verification email:",e); } products=[]; sales=[]; purchases=[]; expenses=[]; duePayments=[]; settings={ name:"Smart Store", owner:name, address:"", phone:"" }; alert( "Account successfully created!\n\n" + "আপনার email-এ verification link পাঠানো হয়েছে।" ); openApp(); }catch(error){ showFirebaseError(error); } } /* ========================================================= LOGIN ========================================================= */ async function loginAccount(){ const email = document.getElementById("loginEmail").value.trim().toLowerCase(); const pass = document.getElementById("loginPassword").value; if(!email || !pass){ alert("Email এবং Password দিন।"); return; } try{ const result = await signInWithEmailAndPassword( auth, email, pass ); await loadAccountData(); openApp(); }catch(error){ showFirebaseError(error); } } /* ========================================================= FIREBASE ERROR ========================================================= */ function showFirebaseError(error){ console.error(error); let msg = error.message || "Unknown error"; if(error.code === "auth/invalid-credential"){ msg = "Email অথবা Password ভুল।"; } else if(error.code === "auth/user-not-found"){ msg = "এই Email দিয়ে Account পাওয়া যায়নি।"; } else if(error.code === "auth/email-already-in-use"){ msg = "এই Email দিয়ে Account আগে থেকেই আছে।"; } else if(error.code === "auth/weak-password"){ msg = "Password কমপক্ষে 6 characters হতে হবে।"; } else if(error.code === "auth/invalid-email"){ msg = "Email সঠিক নয়।"; } else if(error.code === "auth/api-key-not-valid"){ msg = "Firebase API Key সঠিক নয়। firebaseConfig ঠিক করুন।"; } else if(error.code === "permission-denied"){ msg = "Firestore permission denied। Firestore Rules ঠিক করুন।"; } alert(msg); } /* ========================================================= OPEN APP ========================================================= */ function openApp(){ document.getElementById("loginScreen").style.display="none"; document.getElementById("app").style.display="block"; updateAccountUI(); loadSettings(); renderAll(); } /* ========================================================= LOGOUT ========================================================= */ async function logoutAccount(){ try{ await signOut(auth); products=[]; sales=[]; purchases=[]; expenses=[]; duePayments=[]; document.getElementById("app").style.display="none"; document.getElementById("loginScreen").style.display="flex"; showLogin(); }catch(error){ showFirebaseError(error); } } /* ========================================================= LOAD FIRESTORE DATA ========================================================= */ async function loadAccountData(){ const user = auth.currentUser; if(!user) return; try{ const profileSnap = await getDoc( doc(db,"users",user.uid) ); const profile = profileSnap.exists() ? profileSnap.data() : {}; const settingsSnap = await getDoc( doc( db, "users", user.uid, "settings", "main" ) ); if(settingsSnap.exists()){ settings = settingsSnap.data(); }else{ settings={ name:"Smart Store", owner:profile.name || user.displayName || "", address:"", phone:"" }; } products = await loadCollection("products"); sales = await loadCollection("sales"); purchases = await loadCollection("purchases"); expenses = await loadCollection("expenses"); duePayments = await loadCollection("duePayments"); }catch(error){ console.error(error); showFirebaseError(error); } } /* ========================================================= LOAD COLLECTION ========================================================= */ async function loadCollection(name){ const snap = await getDocs( collectionRef(name) ); return snap.docs.map(d=>({ id:d.id, ...d.data() })); } /* ========================================================= SAVE ONE DOCUMENT ========================================================= */ async function saveDocument(collectionName,data){ if(!auth.currentUser)return; const id = data.id || uid(); data.id=id; await setDoc( documentRef(collectionName,id), data ); } /* ========================================================= SAVE ALL DATA ========================================================= */ async function saveData(){ if(!auth.currentUser)return; try{ await setDoc( doc( db, "users", auth.currentUser.uid, "settings", "main" ), settings ); await saveCollection("products",products); await saveCollection("sales",sales); await saveCollection("purchases",purchases); await saveCollection("expenses",expenses); await saveCollection("duePayments",duePayments); }catch(error){ console.error(error); showFirebaseError(error); } } /* ========================================================= SAVE COLLECTION WITHOUT 500 BATCH LIMIT PROBLEM ========================================================= */ async function saveCollection(name,data){ for(let i=0;i<data.length;i++){ const item = data[i]; await setDoc( documentRef( name, item.id || uid() ), item ); } } /* ========================================================= DELETE FIRESTORE DOCUMENT ========================================================= */ async function deleteCollectionDocument(name,id){ if(!auth.currentUser)return; await deleteDoc( documentRef(name,id) ); } /* ========================================================= ACCOUNT UI ========================================================= */ function updateAccountUI(){ const user=auth.currentUser; if(!user)return; const name = user.displayName || settings.owner || "Account"; document.getElementById("sideUserName") .textContent=name; document.getElementById("sideUserEmail") .textContent=user.email; document.getElementById("accountInfo").innerHTML = "<b>Name:</b> "+ escapeHtml(name)+ "<br><b>Email:</b> "+ escapeHtml(user.email || "") + "<br><b>Firebase UID:</b> "+ escapeHtml(user.uid); } /* ========================================================= FORGOT PASSWORD ========================================================= */ async function sendResetCode(){ const email = document.getElementById("forgotEmail").value.trim().toLowerCase(); if(!email){ alert("Email দিন।"); return; } try{ await sendPasswordResetEmail( auth, email ); alert( "Password reset link আপনার email-এ পাঠানো হয়েছে।\n\n" + "Email খুলে link-এ গিয়ে নতুন Password দিন।" ); showLogin(); }catch(error){ showFirebaseError(error); } } /* পুরোনো demo OTP আর ব্যবহার হচ্ছে না */ function resetPassword(){ alert( "এখন Password reset করতে email-এর Reset Password link ব্যবহার করুন।" ); } /* ========================================================= EMAIL VERIFICATION ========================================================= */ async function sendVerificationEmail(){ const user=auth.currentUser; if(!user)return; try{ await sendEmailVerification(user); alert("Verification email আবার পাঠানো হয়েছে।"); }catch(error){ showFirebaseError(error); } } /* ========================================================= OLD DATA MIGRATION ========================================================= */ function hasLegacyData(){ try{ const p = JSON.parse( localStorage.getItem("products") || "[]" ); const s = JSON.parse( localStorage.getItem("sales") || "[]" ); const pu = JSON.parse( localStorage.getItem("purchases") || "[]" ); const e = JSON.parse( localStorage.getItem("expenses") || "[]" ); return ( p.length || s.length || pu.length || e.length ); }catch(e){ return false; } } function stableHash(str){ let h=0; for(let i=0;i<str.length;i++){ h=((h<<5)-h)+str.charCodeAt(i); h|=0; } return Math.abs(h).toString(36); } function migrationKey(type,obj){ if( obj && obj.id !== undefined && obj.id !== null ){ return type+"_"+String(obj.id); } const copy={...(obj||{})}; delete copy.migrated; delete copy.migratedAt; delete copy.oldMigrationId; return type+"_"+stableHash( JSON.stringify(copy) ); } /* ========================================================= MIGRATE OLD DATA ========================================================= */ async function migrateOldData(showMessage=false){ if(!auth.currentUser){ if(showMessage) alert("আগে Login করুন।"); return false; } try{ const oldProducts = JSON.parse( localStorage.getItem("products") || "[]" ); const oldSales = JSON.parse( localStorage.getItem("sales") || "[]" ); const oldPurchases = JSON.parse( localStorage.getItem("purchases") || "[]" ); const oldExpenses = JSON.parse( localStorage.getItem("expenses") || "[]" ); const oldSettings = JSON.parse( localStorage.getItem("storeSettings") || "null" ); const hasOld = oldProducts.length || oldSales.length || oldPurchases.length || oldExpenses.length; if(!hasOld){ if(showMessage) alert("পুরোনো data পাওয়া যায়নি।"); return false; } const existingKeys=new Set(); [ ...products, ...sales, ...purchases, ...expenses ].forEach(item=>{ if(item.oldMigrationId){ existingKeys.add( item.oldMigrationId ); } }); const productIdMap={}; const migratedProducts=[]; oldProducts.forEach(old=>{ const key= migrationKey("product",old); if(existingKeys.has(key))return; const newId=uid(); if(old.id){ productIdMap[String(old.id)]=newId; } migratedProducts.push({ ...old, id:newId, migrated:true, migratedAt:new Date().toISOString(), oldMigrationId:key }); existingKeys.add(key); }); const migratedSales=[]; oldSales.forEach(old=>{ const key= migrationKey("sale",old); if(existingKeys.has(key))return; const newItems = (old.items || []).map(item=>({ ...item, productId: productIdMap[String(item.productId)] || item.productId })); migratedSales.push({ ...old, id:uid(), items:newItems, migrated:true, migratedAt:new Date().toISOString(), oldMigrationId:key }); existingKeys.add(key); }); const migratedPurchases=[]; oldPurchases.forEach(old=>{ const key= migrationKey("purchase",old); if(existingKeys.has(key))return; migratedPurchases.push({ ...old, id:uid(), productId: productIdMap[String(old.productId)] || old.productId, migrated:true, migratedAt:new Date().toISOString(), oldMigrationId:key }); existingKeys.add(key); }); const migratedExpenses=[]; oldExpenses.forEach(old=>{ const key= migrationKey("expense",old); if(existingKeys.has(key))return; migratedExpenses.push({ ...old, id:uid(), migrated:true, migratedAt:new Date().toISOString(), oldMigrationId:key }); existingKeys.add(key); }); products=[ ...products, ...migratedProducts ]; sales=[ ...sales, ...migratedSales ]; purchases=[ ...purchases, ...migratedPurchases ]; expenses=[ ...expenses, ...migratedExpenses ]; if(oldSettings){ settings={ ...settings, ...oldSettings }; } await saveData(); loadSettings(); renderAll(); const msg= "Migration complete: "+ migratedProducts.length+ " Products, "+ migratedSales.length+ " Sales, "+ migratedPurchases.length+ " Purchases, "+ migratedExpenses.length+ " Expenses."; document.getElementById( "migrationResult" ).textContent=msg; if(showMessage) alert(msg); return true; }catch(error){ console.error(error); alert( "Migration failed: "+ error.message ); return false; } } /* ========================================================= MIGRATED EXPENSE ========================================================= */ function showMigratedExpenses(){ const migrated = expenses.filter( e=>e.migrated===true ); if(!migrated.length){ document.getElementById( "migrationResult" ).textContent= "কোনো migrated expense পাওয়া যায়নি।"; alert( "কোনো migrated expense পাওয়া যায়নি।" ); return; } let text= "Migrated Expenses:\n\n"; migrated.forEach((e,i)=>{ text += (i+1)+". "+ (e.name||"Expense")+ " | "+ money(e.amount)+ " | "+ (e.date||"")+ "\n"; }); alert(text); document.getElementById( "migrationResult" ).textContent= "মোট "+ migrated.length+ "টি migrated expense পাওয়া গেছে।"; } async function deleteMigratedExpenses(){ const list = expenses.filter( e=>e.migrated===true ); if(!list.length){ alert( "কোনো migrated expense নেই।" ); return; } if(!confirm( "মোট "+list.length+ "টি migrated expense delete করবেন?" ))return; for(const e of list){ await deleteCollectionDocument( "expenses", e.id ); } expenses = expenses.filter( e=>e.migrated!==true ); renderAll(); document.getElementById( "migrationResult" ).textContent= list.length+ "টি migrated expense delete করা হয়েছে।"; alert( list.length+ "টি migrated expense successfully deleted!" ); } /* ========================================================= NAVIGATION ========================================================= */ function showSection(id,btn){ document.querySelectorAll(".section") .forEach( s=>s.classList.remove("active") ); document.getElementById(id) .classList.add("active"); document.querySelectorAll(".navBtn") .forEach( b=>b.classList.remove("active") ); if(btn) btn.classList.add("active"); } /* ========================================================= PRODUCTS ========================================================= */ async function addProduct(){ const name = document.getElementById("productName") .value.trim(); if(!name){ alert("Product name দিন।"); return; } const code = document.getElementById("productCode") .value.trim() || "P"+Date.now(); if(products.some( p=> String(p.code).toLowerCase() === code.toLowerCase() )){ alert( "এই Product Code আগে থেকেই আছে।" ); return; } const product={ id:uid(), name, code, category: document.getElementById("productCategory") .value.trim(), purchasePrice: Number( document.getElementById("purchasePrice") .value )||0, sellingPrice: Number( document.getElementById("sellingPrice") .value )||0, stock: Number( document.getElementById("productStock") .value )||0, unit: document.getElementById("productUnit") .value.trim() ||"pcs", minStock: Number( document.getElementById("minStock") .value )||0 }; try{ await saveDocument( "products", product ); products.push(product); clearProductForm(); renderAll(); alert( "Product added successfully!" ); }catch(error){ showFirebaseError(error); } } function clearProductForm(){ [ "productName", "productCode", "productCategory", "purchasePrice", "sellingPrice", "productStock", "productUnit", "minStock" ].forEach(id=>{ document.getElementById(id).value=""; }); } function renderProducts(){ const search = document.getElementById( "productSearch" )?.value.toLowerCase() || ""; const list = products.filter(p=> String(p.name||"") .toLowerCase() .includes(search) || String(p.code||"") .toLowerCase() .includes(search) || String(p.category||"") .toLowerCase() .includes(search) ); document.getElementById( "productTable" ).innerHTML= list.map(p=> <tr> <td> ${p.migrated?"🔄 ":""} ${escapeHtml(p.name)} </td> <td> ${escapeHtml(p.code)} </td> <td> ${escapeHtml(p.category)} </td> <td> ${money(p.purchasePrice)} </td> <td> ${money(p.sellingPrice)} </td> <td class="${p.stock<=p.minStock?'lowStock':'goodStock'}"> ${p.stock} </td> <td> ${escapeHtml(p.unit)} </td> <td> <button onclick="editProduct('${p.id}')"> ✏️ </button> <button class="btnRed" onclick="deleteProduct('${p.id}')"> 🗑️ </button> <button class="btnDark" onclick="showBarcode('${p.id}')"> ▣ </button> </td> </tr> ).join(""); } async function editProduct(id){ const p = products.find(x=>x.id===id); if(!p)return; const price = prompt( "নতুন Selling Price:", p.sellingPrice ); if(price===null)return; p.sellingPrice = Number(price)||0; try{ await saveDocument( "products", p ); renderAll(); }catch(error){ showFirebaseError(error); } } async function deleteProduct(id){ if(!confirm( "Product delete করবেন?" ))return; try{ await deleteCollectionDocument( "products", id ); products = products.filter( p=>p.id!==id ); renderAll(); }catch(error){ showFirebaseError(error); } } /* ========================================================= BARCODE ========================================================= */ function showBarcode(id){ const p = products.find(x=>x.id===id); if(!p)return; document.getElementById( "barcodeModal" ).style.display="flex"; JsBarcode( "#barcodeSvg", String(p.code), { format:"CODE128", displayValue:true, text:p.name, width:2, height:80, margin:10 } ); } function closeModal(id){ document.getElementById(id) .style.display="none"; } /* ========================================================= SALES ========================================================= */ function addSaleRow(){ saleRowCounter++; const id=saleRowCounter; const div= document.createElement("div"); div.className="saleRow"; div.id="saleRow_"+id; div.innerHTML= <input list="saleProductList" class="saleProduct" placeholder="Type Product Name / Code" oninput="saleProductChanged(${id})"> <input type="number" class="saleQty" value="1" min="1" oninput="calculateSale()"> <input class="salePrice" readonly placeholder="Price"> <input class="saleSubtotal" readonly placeholder="Subtotal"> <button class="btnRed" onclick="removeSaleRow(${id})"> ✕ </button> ; document.getElementById( "saleRows" ).appendChild(div); renderSaleProductList(); } function removeSaleRow(id){ document.getElementById( "saleRow_"+id )?.remove(); calculateSale(); } function renderSaleProductList(){ let old = document.getElementById( "saleProductList" ); if(old)old.remove(); const list = document.createElement("datalist"); list.id="saleProductList"; products.forEach(p=>{ const o = document.createElement("option"); o.value=p.name; o.label= p.code+" | "+p.name; list.appendChild(o); }); document.body.appendChild(list); } function findProduct(text){ const value= String(text||"") .trim() .toLowerCase(); return products.find(p=> String(p.name||"") .toLowerCase()===value || String(p.code||"") .toLowerCase()===value ); } function saleProductChanged(id){ const row = document.getElementById( "saleRow_"+id ); if(!row)return; const input = row.querySelector( ".saleProduct" ); const p = findProduct(input.value); row.querySelector( ".salePrice" ).value = p ? p.sellingPrice : ""; calculateSale(); } function calculateSale(){ let total=0; document.querySelectorAll( ".saleRow" ).forEach(row=>{ const qty = Number( row.querySelector(".saleQty") .value )||0; const price = Number( row.querySelector(".salePrice") .value )||0; const sub=qty*price; row.querySelector( ".saleSubtotal" ).value= sub.toFixed(2); total+=sub; }); document.getElementById( "saleTotal" ).value= total.toFixed(2); const paid = Number( document.getElementById( "salePaid" ).value )||0; document.getElementById( "saleDue" ).value= Math.max( 0, total-paid ).toFixed(2); } async function completeSale(){ const rows = [...document.querySelectorAll( ".saleRow" )]; if(!rows.length){ alert( "কমপক্ষে একটি product যোগ করুন।" ); return; } const items=[]; for(const row of rows){ const input = row.querySelector( ".saleProduct" ); const p = findProduct(input.value); const qty = Number( row.querySelector(".saleQty") .value )||0; if(!p){ alert( "Product পাওয়া যায়নি: "+ input.value ); return; } if(qty<=0){ alert( "Quantity সঠিক দিন।" ); return; } if(p.stock<qty){ alert( p.name+ " এর stock পর্যাপ্ত নেই। Current stock: "+ p.stock ); return; } items.push({ productId:p.id, name:p.name, code:p.code, qty, price:p.sellingPrice, purchasePrice:p.purchasePrice, subtotal: qty*p.sellingPrice }); } const total = items.reduce( (sum,i)=>sum+i.subtotal, 0 ); const paid = Number( document.getElementById( "salePaid" ).value )||0; if(paid>total){ alert( "Paid amount total-এর চেয়ে বেশি হতে পারবে না।" ); return; } const sale={ id:uid(), invoice: "INV-"+Date.now(), date: document.getElementById( "saleDate" ).value||today(), customer: document.getElementById( "saleCustomer" ).value.trim() ||"Walk-in Customer", payment: document.getElementById( "salePayment" ).value.trim() ||"Cash", items, total, paid, due: total-paid }; try{ for(const item of items){ const p = products.find( x=>x.id===item.productId ); if(p){ p.stock-=item.qty; await saveDocument( "products", p ); } } await saveDocument( "sales", sale ); sales.push(sale); printInvoiceForSale(sale); document.getElementById( "saleRows" ).innerHTML=""; document.getElementById( "salePaid" ).value=""; document.getElementById( "saleCustomer" ).value=""; document.getElementById( "saleTotal" ).value="0"; document.getElementById( "saleDue" ).value="0"; addSaleRow(); renderAll(); }catch(error){ showFirebaseError(error); } } async function deleteSale(id){ const sale = sales.find( s=>s.id===id ); if(!sale)return; if(!confirm( "Sale delete করবেন? Stock আবার যোগ হবে।" ))return; try{ for(const item of sale.items||[]){ const p = products.find( x=>x.id===item.productId ); if(p){ p.stock+=item.qty; await saveDocument( "products", p ); } } await deleteCollectionDocument( "sales", id ); sales = sales.filter( s=>s.id!==id ); renderAll(); }catch(error){ showFirebaseError(error); } } function renderSales(){ document.getElementById( "salesTable" ).innerHTML= sales.slice().reverse() .map(s=> <tr> <td> ${s.migrated?"🔄 ":""} ${escapeHtml(s.date)} </td> <td> ${escapeHtml(s.customer)} </td> <td> ${money(s.total)} </td> <td> ${money(s.paid)} </td> <td class="${s.due>0?'lowStock':'goodStock'}"> ${money(s.due)} </td> <td> <button onclick="printInvoiceForSaleById('${s.id}')"> 🖨️ </button> <button class="btnRed" onclick="deleteSale('${s.id}')"> 🗑️ </button> </td> </tr> ).join(""); } /* ========================================================= PURCHASE ========================================================= */ function renderPurchaseProducts(){ const list = document.getElementById( "purchaseProductList" ); list.innerHTML=""; products.forEach(p=>{ const o = document.createElement( "option" ); o.value=p.name; o.label= p.code+" | "+p.name; list.appendChild(o); }); } function purchaseProductChanged(){ const p = findProduct( document.getElementById( "purchaseProduct" ).value ); if(p){ document.getElementById( "purchasePrice2" ).value= p.purchasePrice; } } async function addPurchase(){ const productInput = document.getElementById( "purchaseProduct" ).value; const p = findProduct(productInput); if(!p){ alert( "Product পাওয়া যায়নি।" ); return; } const qty = Number( document.getElementById( "purchaseQty" ).value )||0; const price = Number( document.getElementById( "purchasePrice2" ).value )||0; if(qty<=0){ alert( "Quantity দিন।" ); return; } const purchase={ id:uid(), date: document.getElementById( "purchaseDate" ).value||today(), productId:p.id, product:p.name, code:p.code, qty, price, supplier: document.getElementById( "supplier" ).value.trim(), total:qty*price }; try{ p.stock+=qty; p.purchasePrice=price; await saveDocument( "products", p ); await saveDocument( "purchases", purchase ); purchases.push(purchase); document.getElementById( "purchaseProduct" ).value=""; document.getElementById( "purchaseQty" ).value=""; document.getElementById( "purchasePrice2" ).value=""; document.getElementById( "supplier" ).value=""; renderAll(); }catch(error){ showFirebaseError(error); } } async function deletePurchase(id){ const pur = purchases.find( x=>x.id===id ); if(!pur)return; if(!confirm( "Purchase delete করবেন? Stock কমে যাবে." ))return; try{ const p = products.find( x=>x.id===pur.productId ); if(p){ p.stock= Math.max( 0, p.stock-pur.qty ); await saveDocument( "products", p ); } await deleteCollectionDocument( "purchases", id ); purchases = purchases.filter( x=>x.id!==id ); renderAll(); }catch(error){ showFirebaseError(error); } } function renderPurchases(){ document.getElementById( "purchaseTable" ).innerHTML= purchases.slice().reverse() .map(p=> <tr> <td> ${p.migrated?"🔄 ":""} ${escapeHtml(p.date)} </td> <td> ${escapeHtml(p.product)} </td> <td> ${p.qty} </td> <td> ${money(p.price)} </td> <td> ${escapeHtml(p.supplier)} </td> <td> ${money(p.total)} </td> <td> <button class="btnRed" onclick="deletePurchase('${p.id}')"> 🗑️ </button> </td> </tr> ).join(""); } /* ========================================================= CUSTOMERS ========================================================= */ function getCustomerData(){ const map={}; sales.forEach(s=>{ const name = s.customer || "Walk-in Customer"; if(!map[name]){ map[name]={ name, total:0, paid:0, originalDue:0 }; } map[name].total += Number(s.total)||0; map[name].paid += Number(s.paid)||0; map[name].originalDue += Number(s.due)||0; }); duePayments.forEach(p=>{ const name=p.customer; if(!map[name]){ map[name]={ name, total:0, paid:0, originalDue:0 }; } map[name].paid += Number(p.amount)||0; }); Object.values(map).forEach(c=>{ c.due= Math.max( 0, c.total-c.paid ); }); return Object.values(map); } function renderCustomers(){ const data = getCustomerData(); document.getElementById( "customerTable" ).innerHTML= data.map(c=> <tr> <td> ${escapeHtml(c.name)} </td> <td> ${money(c.total)} </td> <td> ${money(c.paid)} </td> <td class="${c.due>0?'lowStock':'goodStock'}"> ${money(c.due)} </td> <td> ${ c.due>0 ? <button class="btnGreen" onclick="openDue('${encodeURIComponent(c.name)}')"> 💰 Pay Due </button> : <span class="badge badgeGreen"> Paid </span> } </td> </tr> ).join(""); } function openDue(encoded){ selectedDueCustomer = decodeURIComponent(encoded); document.getElementById( "dueCustomerName" ).textContent= "Customer: "+ selectedDueCustomer; document.getElementById( "dueAmount" ).value=""; document.getElementById( "dueNote" ).value=""; document.getElementById( "dueModal" ).style.display="flex"; } async function receiveDue(){ const amount = Number( document.getElementById( "dueAmount" ).value )||0; if(amount<=0){ alert( "Payment amount দিন।" ); return; } const customerData = getCustomerData().find( c=>c.name===selectedDueCustomer ); if(!customerData){ alert( "Customer পাওয়া যায়নি।" ); return; } if(amount>customerData.due){ alert( "Due-এর চেয়ে বেশি payment দেওয়া যাবে না।" ); return; } const payment={ id:uid(), customer:selectedDueCustomer, amount, date:today(), note: document.getElementById( "dueNote" ).value.trim() }; try{ await saveDocument( "duePayments", payment ); duePayments.push(payment); closeModal("dueModal"); renderAll(); alert( "Due payment received successfully!" ); }catch(error){ showFirebaseError(error); } } /* ========================================================= EXPENSE ========================================================= */ async function addExpense(){ const name = document.getElementById( "expenseName" ).value.trim(); const amount = Number( document.getElementById( "expenseAmount" ).value )||0; if(!name || amount<=0){ alert( "Expense name ও amount দিন।" ); return; } const expense={ id:uid(), date: document.getElementById( "expenseDate" ).value||today(), name, amount, note: document.getElementById( "expenseNote" ).value.trim() }; try{ await saveDocument( "expenses", expense ); expenses.push(expense); document.getElementById( "expenseName" ).value=""; document.getElementById( "expenseAmount" ).value=""; document.getElementById( "expenseNote" ).value=""; renderAll(); }catch(error){ showFirebaseError(error); } } async function deleteExpense(id){ if(!confirm( "Expense delete করবেন?" ))return; try{ await deleteCollectionDocument( "expenses", id ); expenses = expenses.filter( e=>e.id!==id ); renderAll(); }catch(error){ showFirebaseError(error); } } function renderExpenses(){ document.getElementById( "expenseTable" ).innerHTML= expenses.slice().reverse() .map(e=> <tr> <td> ${e.migrated?"🔄 ":""} ${escapeHtml(e.date)} </td> <td> ${e.migrated?"🔄 ":""} ${escapeHtml(e.name)} </td> <td> ${money(e.amount)} </td> <td> ${escapeHtml(e.note)} </td> <td> <button class="btnRed" onclick="deleteExpense('${e.id}')"> 🗑️ </button> </td> </tr> ).join(""); } /* ========================================================= TOTALS ========================================================= */ function getTotals(){ const totalSales = sales.reduce( (sum,s)=> sum+ (Number(s.total)||0), 0 ); const totalPurchase = purchases.reduce( (sum,p)=> sum+ (Number(p.total)||0), 0 ); const totalExpense = expenses.reduce( (sum,e)=> sum+ (Number(e.amount)||0), 0 ); const grossProfit = sales.reduce( (sum,s)=>{ const profit = (s.items||[]).reduce( (a,i)=> a+ ( (Number(i.price)||0)- (Number(i.purchasePrice)||0) )* (Number(i.qty)||0), 0 ); return sum+profit; }, 0 ); const due = getCustomerData().reduce( (sum,c)=> sum+c.due, 0 ); const stockValue = products.reduce( (sum,p)=> sum+ (Number(p.stock)||0)* (Number(p.purchasePrice)||0), 0 ); return{ totalSales, totalPurchase, totalExpense, grossProfit, due, stockValue, netProfit: grossProfit-totalExpense }; } /* ========================================================= DASHBOARD ========================================================= */ function updateDashboard(){ const t=getTotals(); const todaySale = sales .filter( s=>s.date===today() ) .reduce( (sum,s)=> sum+ (Number(s.total)||0), 0 ); const low = products.filter( p=> Number(p.stock)<= Number(p.minStock) ); document.getElementById( "todaySales" ).textContent= money(todaySale); document.getElementById( "totalProducts" ).textContent= products.length; document.getElementById( "totalProfit" ).textContent= money(t.grossProfit); document.getElementById( "totalExpense" ).textContent= money(t.totalExpense); document.getElementById( "customerDue" ).textContent= money(t.due); document.getElementById( "stockValue" ).textContent= money(t.stockValue); document.getElementById( "lowStockCount" ).textContent= low.length; document.getElementById( "netProfit" ).textContent= money(t.netProfit); document.getElementById( "lowStockTable" ).innerHTML= low.map(p=> <tr> <td> ${escapeHtml(p.name)} </td> <td> ${escapeHtml(p.code)} </td> <td class="lowStock"> ${p.stock} </td> <td> ${p.minStock} </td> </tr> ).join(""); } /* ========================================================= REPORTS ========================================================= */ function updateReport(){ const t=getTotals(); document.getElementById( "reportSales" ).textContent= money(t.totalSales); document.getElementById( "reportPurchase" ).textContent= money(t.totalPurchase); document.getElementById( "reportGross" ).textContent= money(t.grossProfit); document.getElementById( "reportExpense" ).textContent= money(t.totalExpense); document.getElementById( "reportNet" ).textContent= money(t.netProfit); document.getElementById( "reportDue" ).textContent= money(t.due); document.getElementById( "reportStock" ).textContent= money(t.stockValue); } /* ========================================================= SETTINGS ========================================================= */ function loadSettings(){ document.getElementById( "storeName" ).value= settings.name||""; document.getElementById( "storeOwner" ).value= settings.owner||""; document.getElementById( "storePhone" ).value= settings.phone||""; document.getElementById( "storeAddress" ).value= settings.address||""; } async function saveSettings(){ settings.name= document.getElementById( "storeName" ).value.trim() ||"Smart Store"; settings.owner= document.getElementById( "storeOwner" ).value.trim(); settings.phone= document.getElementById( "storePhone" ).value.trim(); settings.address= document.getElementById( "storeAddress" ).value.trim(); try{ await setDoc( doc( db, "users", auth.currentUser.uid, "settings", "main" ), settings ); if(auth.currentUser.displayName !==settings.owner){ await updateProfile( auth.currentUser, { displayName: settings.owner } ); } updateAccountUI(); alert( "Settings saved!" ); }catch(error){ showFirebaseError(error); } } /* ========================================================= INVOICE ========================================================= */ function printInvoiceForSaleById(id){ const sale = sales.find( s=>s.id===id ); if(sale) printInvoiceForSale(sale); } function printInvoiceForSale(sale){ document.getElementById( "invoiceStoreName" ).textContent= settings.name||"Smart Store"; document.getElementById( "invoiceAddress" ).textContent= settings.address||""; document.getElementById( "invoicePhone" ).textContent= settings.phone||""; document.getElementById( "invoiceNumber" ).textContent= sale.invoice; document.getElementById( "invoiceDate" ).textContent= sale.date; document.getElementById( "invoiceCustomer" ).textContent= sale.customer; document.getElementById( "invoiceItems" ).innerHTML= (sale.items||[]) .map(i=> <tr> <td style="border:1px solid #000;padding:8px"> ${escapeHtml(i.name)} </td> <td style="border:1px solid #000;padding:8px"> ${i.qty} </td> <td style="border:1px solid #000;padding:8px"> ৳${Number(i.price).toFixed(2)} </td> <td style="border:1px solid #000;padding:8px"> ৳${Number(i.subtotal).toFixed(2)} </td> </tr> ).join(""); document.getElementById( "invoiceTotal" ).textContent= Number(sale.total).toFixed(2); document.getElementById( "invoicePaid" ).textContent= Number(sale.paid).toFixed(2); document.getElementById( "invoiceDue" ).textContent= Number(sale.due).toFixed(2); document.getElementById( "invoiceOwner" ).textContent= settings.owner||""; setTimeout( ()=>window.print(), 300 ); } /* ========================================================= BACKUP ========================================================= */ function backupData(){ if(!auth.currentUser){ alert("Login করুন।"); return; } const backup={ app:"Smart Store", version:3, date: new Date().toISOString(), data:{ products, sales, purchases, expenses, duePayments, settings } }; const blob= new Blob( [ JSON.stringify( backup, null, 2 ) ], { type:"application/json" } ); const url= URL.createObjectURL(blob); const a= document.createElement("a"); a.href=url; a.download= "smart-store-backup-"+ today()+ ".json"; a.click(); URL.revokeObjectURL(url); } /* ========================================================= RESTORE ========================================================= */ async function restoreData(event){ const file = event.target.files[0]; if(!file)return; const reader = new FileReader(); reader.onload= async function(e){ try{ const backup = JSON.parse( e.target.result ); const data = backup.data || backup; if(!data) throw new Error(); if(!confirm( "বর্তমান data replace করে backup restore করবেন?" ))return; products = data.products||[]; sales = data.sales||[]; purchases = data.purchases||[]; expenses = data.expenses||[]; duePayments = data.duePayments||[]; settings = data.settings||settings; /* Restore-এর জন্য পুরোনো Firestore collection delete করে নতুন data save */ await replaceCollection( "products", products ); await replaceCollection( "sales", sales ); await replaceCollection( "purchases", purchases ); await replaceCollection( "expenses", expenses ); await replaceCollection( "duePayments", duePayments ); await setDoc( doc( db, "users", auth.currentUser.uid, "settings", "main" ), settings ); loadSettings(); renderAll(); alert( "Backup successfully restored!" ); }catch(err){ console.error(err); alert( "Backup file সঠিক নয়।" ); } }; reader.readAsText(file); event.target.value=""; } /* ========================================================= REPLACE COLLECTION ========================================================= */ async function replaceCollection( name, data ){ const snap = await getDocs( collectionRef(name) ); /* Delete old documents */ for(const d of snap.docs){ await deleteDoc(d.ref); } /* Add backup documents */ for(const item of data){ const id = item.id || uid(); item.id=id; await setDoc( documentRef( name, id ), item ); } } /* ========================================================= DELETE FIREBASE ACCOUNT + ALL DATA ========================================================= */ async function deleteCurrentAccount(){ const user = auth.currentUser; if(!user)return; const ok = confirm( "আপনার Account এবং এই account-এর সব data delete হয়ে যাবে। নিশ্চিত?" ); if(!ok)return; const confirmText = prompt( 'নিশ্চিত করতে "DELETE" লিখুন' ); if(confirmText!=="DELETE"){ alert( "Account delete বাতিল করা হয়েছে।" ); return; } try{ const collections=[ "products", "sales", "purchases", "expenses", "duePayments" ]; /* সব data delete */ for(const name of collections){ const snap = await getDocs( collectionRef(name) ); for(const d of snap.docs){ await deleteDoc(d.ref); } } /* Settings delete */ await deleteDoc( doc( db, "users", user.uid, "settings", "main" ) ); /* User profile delete */ await deleteDoc( doc( db, "users", user.uid ) ); /* Firebase Authentication account delete */ await deleteUser(user); alert( "Account successfully deleted." ); location.reload(); }catch(error){ console.error(error); if( error.code === "auth/requires-recent-login" ){ alert( "Security কারণে আবার Login করে Account Delete করুন।" ); }else{ showFirebaseError(error); } } } /* ========================================================= RENDER ALL ========================================================= */ function renderAll(){ renderProducts(); renderSales(); renderPurchases(); renderCustomers(); renderExpenses(); renderSaleProductList(); renderPurchaseProducts(); updateDashboard(); updateReport(); } /* ========================================================= FIREBASE AUTH STATE ========================================================= */ onAuthStateChanged( auth, async user=>{ if(user){ try{ await loadAccountData(); document.getElementById( "loginScreen" ).style.display="none"; document.getElementById( "app" ).style.display="block"; updateAccountUI(); loadSettings(); renderAll(); }catch(error){ console.error(error); } }else{ document.getElementById( "app" ).style.display="none"; document.getElementById( "loginScreen" ).style.display="flex"; showLogin(); } } ); /* ========================================================= MAKE FUNCTIONS AVAILABLE TO HTML onclick ========================================================= */ window.showCreateAccount=showCreateAccount; window.showLogin=showLogin; window.showForgotPassword=showForgotPassword; window.createAccount=createAccount; window.loginAccount=loginAccount; window.logoutAccount=logoutAccount; window.sendResetCode=sendResetCode; window.resetPassword=resetPassword; window.sendVerificationEmail= sendVerificationEmail; window.migrateOldData=migrateOldData; window.showMigratedExpenses= showMigratedExpenses; window.deleteMigratedExpenses= deleteMigratedExpenses; window.showSection=showSection; window.addProduct=addProduct; window.clearProductForm= clearProductForm; window.renderProducts=renderProducts; window.editProduct=editProduct; window.deleteProduct=deleteProduct; window.showBarcode=showBarcode; window.closeModal=closeModal; window.addSaleRow=addSaleRow; window.removeSaleRow=removeSaleRow; window.saleProductChanged= saleProductChanged; window.calculateSale=calculateSale; window.completeSale=completeSale; window.deleteSale=deleteSale; window.printInvoiceForSaleById= printInvoiceForSaleById; window.purchaseProductChanged= purchaseProductChanged; window.addPurchase=addPurchase; window.deletePurchase=deletePurchase; window.openDue=openDue; window.receiveDue=receiveDue; window.addExpense=addExpense; window.deleteExpense=deleteExpense; window.saveSettings=saveSettings; window.backupData=backupData; window.restoreData=restoreData; window.deleteCurrentAccount= deleteCurrentAccount; /* ========================================================= STARTUP ========================================================= */ document.getElementById( "saleDate" ).value=today(); document.getElementById( "purchaseDate" ).value=today(); document.getElementById( "expenseDate" ).value=today(); addSaleRow(); </script> neo akhn code deo sob mile
