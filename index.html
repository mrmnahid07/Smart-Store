/* =====================================================
   UTILITY
===================================================== */

function toast(message) {

  const el = document.getElementById("toast");

  if (!el) {
    alert(message);
    return;
  }

  el.innerText = String(message || "");
  el.style.display = "block";

  clearTimeout(window.__toastTimer);

  window.__toastTimer = setTimeout(() => {
    el.style.display = "none";
  }, 3000);

}


function getCurrentUser() {

  if (!auth || !auth.currentUser) {
    throw new Error("আপনি Login করেননি।");
  }

  return auth.currentUser;

}


function uid() {

  return getCurrentUser().uid;

}


function userCollection(name) {

  return collection(
    db,
    "users",
    uid(),
    name
  );

}


function userDoc(name, id) {

  return doc(
    db,
    "users",
    uid(),
    name,
    String(id)
  );

}


function newId() {

  return (
    Date.now().toString() +
    Math.random().toString(36).substring(2, 8)
  );

}


function safeNumber(value) {

  const number = Number(value);

  return Number.isFinite(number)
    ? number
    : 0;

}


function escapeHtml(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


function firebaseErrorMessage(error, defaultMessage = "কাজটি করা যায়নি।") {

  if (!error) {
    return defaultMessage;
  }

  switch (error.code) {

    case "auth/api-key-not-valid":
      return "Firebase API Key invalid। Firebase Console-এর Web App Config পরীক্ষা করুন।";

    case "auth/operation-not-allowed":
      return "Firebase Console → Authentication → Sign-in method থেকে Email/Password চালু করুন।";

    case "auth/email-already-in-use":
      return "এই Email দিয়ে আগে থেকেই Account আছে।";

    case "auth/invalid-email":
      return "সঠিক Email Address দিন।";

    case "auth/weak-password":
      return "Password কমপক্ষে 6 অক্ষরের হতে হবে।";

    case "auth/invalid-credential":
      return "Email অথবা Password ভুল।";

    case "auth/user-not-found":
      return "এই Email দিয়ে কোনো Account পাওয়া যায়নি।";

    case "auth/wrong-password":
      return "Password ভুল।";

    case "auth/network-request-failed":
      return "Internet connection পরীক্ষা করুন।";

    case "auth/too-many-requests":
      return "অনেকবার চেষ্টা করা হয়েছে। কিছুক্ষণ পর আবার চেষ্টা করুন।";

    case "auth/requires-recent-login":
      return "নিরাপত্তার কারণে আবার Login করে তারপর চেষ্টা করুন।";

    case "permission-denied":
      return "Firebase Firestore Rules-এর কারণে এই কাজটি অনুমোদিত নয়।";

    case "unavailable":
      return "Firebase server বর্তমানে unavailable। কিছুক্ষণ পর আবার চেষ্টা করুন।";

    case "failed-precondition":
      return "Firebase configuration বা database setup পরীক্ষা করুন।";

    default:
      return error.message || defaultMessage;

  }

}

/* =====================================================
   CREATE ACCOUNT
===================================================== */

window.createAccount = async function () {

  const name =
    document.getElementById("signupName")?.value.trim() || "";

  const email =
    document.getElementById("signupEmail")?.value.trim() || "";

  const password =
    document.getElementById("signupPassword")?.value || "";


  if (!name) {
    toast("আপনার নাম দিন");
    return;
  }

  if (!email) {
    toast("Email দিন");
    return;
  }

  if (!password) {
    toast("Password দিন");
    return;
  }

  if (password.length < 6) {
    toast("Password কমপক্ষে 6 অক্ষরের হতে হবে");
    return;
  }


  try {

    const result =
      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );


    const user = result.user;


    /* Profile */

    try {

      await updateProfile(
        user,
        {
          displayName: name
        }
      );

    } catch (_) {
      // Profile update fail হলেও account থাকবে
    }


    /* Main User Document */

    await setDoc(
      doc(
        db,
        "users",
        user.uid
      ),
      {
        name: name,
        email: email,
        createdAt: new Date().toISOString()
      }
    );


    /* Default Settings */

    await setDoc(
      doc(
        db,
        "users",
        user.uid,
        "settings",
        "main"
      ),
      {
        storeName: "Smart Store"
      }
    );


    /* Verification */

    try {

      await sendEmailVerification(user);

    } catch (_) {
      // Verification fail হলেও account creation সফল
    }


    const nameInput = document.getElementById("signupName");
    const emailInput = document.getElementById("signupEmail");
    const passwordInput = document.getElementById("signupPassword");

    if (nameInput) nameInput.value = "";
    if (emailInput) emailInput.value = "";
    if (passwordInput) passwordInput.value = "";


    toast(
      "Account সফলভাবে তৈরি হয়েছে।"
    );

  } catch (error) {

    toast(
      firebaseErrorMessage(
        error,
        "Account তৈরি করা যায়নি।"
      )
    );

  }

};

/* =====================================================
   AUTH STATE
===================================================== */

if (auth) {

  onAuthStateChanged(
    auth,
    async user => {

      const loginScreen =
        document.getElementById("loginScreen");

      const signupScreen =
        document.getElementById("signupScreen");

      const app =
        document.getElementById("app");


      if (user) {

        if (loginScreen) {
          loginScreen.classList.add("hidden");
        }

        if (signupScreen) {
          signupScreen.classList.add("hidden");
        }

        if (app) {
          app.style.display = "block";
        }


        const userEmail =
          document.getElementById("userEmail");

        const accountInfo =
          document.getElementById("accountInfo");


        if (userEmail) {
          userEmail.innerText =
            user.email || "";
        }


        if (accountInfo) {
          accountInfo.innerText =
            `${user.displayName || "User"} | ${user.email || ""}`;
        }


        try {

          await loadAll();
          showPage("dashboard");

        } catch (error) {

          toast(
            "Data load করা যায়নি: " +
            firebaseErrorMessage(error)
          );

        }

      } else {

        if (app) {
          app.style.display = "none";
        }

        if (signupScreen) {
          signupScreen.classList.add("hidden");
        }

        if (loginScreen) {
          loginScreen.classList.remove("hidden");
        }

      }

    }
  );

}


/* =====================================================
   LOAD COLLECTION
===================================================== */

async function loadCollection(name) {

  const snapshot =
    await getDocs(
      userCollection(name)
    );


  return snapshot.docs.map(
    d => ({
      id: d.id,
      ...d.data()
    })
  );

}


/* =====================================================
   LOAD ALL
===================================================== */

async function loadAll() {

  products =
    await loadCollection("products");

  sales =
    await loadCollection("sales");

  purchases =
    await loadCollection("purchases");

  expenses =
    await loadCollection("expenses");

  duePayments =
    await loadCollection("duePayments");


  const settingsSnap =
    await getDoc(
      doc(
        db,
        "users",
        uid(),
        "settings",
        "main"
      )
    );


  if (settingsSnap.exists()) {

    settings = {
      storeName:
        settingsSnap.data().storeName ||
        "Smart Store"
    };

  } else {

    settings = {
      storeName: "Smart Store"
    };


    await setDoc(
      doc(
        db,
        "users",
        uid(),
        "settings",
        "main"
      ),
      settings
    );

  }


  const storeName =
    document.getElementById("storeName");

  const headerStore =
    document.getElementById("headerStore");


  if (storeName) {
    storeName.value =
      settings.storeName;
  }


  if (headerStore) {
    headerStore.innerText =
      settings.storeName;
  }


  renderAll();

}


/* =====================================================
   SAVE
===================================================== */

async function saveItem(
  collectionName,
  item
) {

  if (!item || !item.id) {
    throw new Error("Invalid data.");
  }

  await setDoc(
    userDoc(
      collectionName,
      item.id
    ),
    item
  );

}


/* =====================================================
   DELETE
===================================================== */

async function removeItem(
  collectionName,
  id
) {

  await deleteDoc(
    userDoc(
      collectionName,
      id
    )
  );

}


/* =====================================================
   PRODUCT ADD
===================================================== */

window.addProduct = async function () {

  try {

    const name =
      document.getElementById("productName")?.value.trim() || "";

    const barcode =
      document.getElementById("productBarcode")?.value.trim() || "";

    const purchase =
      safeNumber(
        document.getElementById("productPurchase")?.value
      );

    const sale =
      safeNumber(
        document.getElementById("productSale")?.value
      );

    const stock =
      safeNumber(
        document.getElementById("productStock")?.value
      );


    if (!name) {
      toast("Product Name দিন");
      return;
    }

    if (purchase < 0 || sale < 0 || stock < 0) {
      toast("Price ও Stock সঠিকভাবে দিন");
      return;
    }


    const item = {

      id: newId(),
      name,
      barcode,
      purchase,
      sale,
      stock,
      createdAt:
        new Date().toISOString()

    };


    await saveItem(
      "products",
      item
    );


    products.push(item);


    [
      "productName",
      "productBarcode",
      "productPurchase",
      "productSale",
      "productStock"
    ].forEach(id => {

      const el = document.getElementById(id);

      if (el) {
        el.value = "";
      }

    });


    renderAll();

    toast("Product added successfully");

  } catch (error) {

    toast(
      firebaseErrorMessage(
        error,
        "Product save করা যায়নি।"
      )
    );

  }

};


/* =====================================================
   DELETE PRODUCT
===================================================== */

window.deleteProduct = async function (id) {

  if (!confirm("Product delete করবেন?")) {
    return;
  }


  try {

    await removeItem(
      "products",
      id
    );


    products =
      products.filter(
        x =>
          String(x.id) !== String(id)
      );


    renderAll();

    toast("Product deleted");

  } catch (error) {

    toast(
      firebaseErrorMessage(
        error,
        "Product delete করা যায়নি।"
      )
    );

  }

};


/* =====================================================
   ADD SALE
===================================================== */

window.addSale = async function () {

  try {

    const productId =
      document.getElementById("saleProduct")?.value || "";

    const qty =
      safeNumber(
        document.getElementById("saleQty")?.value
      );

    const customer =
      document.getElementById("saleCustomer")?.value.trim() || "";

    const paid =
      safeNumber(
        document.getElementById("salePaid")?.value
      );


    const product =
      products.find(
        x =>
          String(x.id) === String(productId)
      );


    if (!product) {

      toast("Product select করুন");
      return;

    }


    if (qty <= 0) {

      toast("Quantity সঠিক দিন");
      return;

    }


    if (product.stock < qty) {

      toast("পর্যাপ্ত stock নেই");
      return;

    }


    const total =
      safeNumber(product.sale) * qty;


    if (paid < 0 || paid > total) {

      toast("Paid amount সঠিক নয়");
      return;

    }


    const due =
      Math.max(
        0,
        total - paid
      );


    const item = {

      id: newId(),
      productId: product.id,
      productName: product.name,
      customer,
      qty,
      total,
      paid,
      due,
      date:
        new Date().toISOString()

    };


    /* Save sale first */

    await saveItem(
      "sales",
      item
    );


    /* Update stock */

    const oldStock =
      safeNumber(product.stock);

    product.stock =
      oldStock - qty;


    await saveItem(
      "products",
      product
    );


    /* Due */

    let dueItem = null;


    if (due > 0) {

      dueItem = {

        id: newId(),

        customer:
          customer || "Unknown",

        amount: due,

        saleId:
          item.id,

        date:
          new Date().toISOString()

      };


      await saveItem(
        "duePayments",
        dueItem
      );

    }


    /* Local update */

    sales.push(item);

    if (dueItem) {
      duePayments.push(dueItem);
    }


    renderAll();

    toast("Sale saved");

  } catch (error) {

    toast(
      firebaseErrorMessage(
        error,
        "Sale save করা যায়নি।"
      )
    );

  }

};


/* =====================================================
   DELETE SALE + RESTORE STOCK + REMOVE DUE
===================================================== */

window.deleteSale = async function (id) {

  if (!confirm("Sale delete করবেন?")) {
    return;
  }


  try {

    const sale =
      sales.find(
        x =>
          String(x.id) === String(id)
      );


    if (!sale) {

      toast("Sale পাওয়া যায়নি");
      return;

    }


    /* Find product */

    const product =
      products.find(
        x =>
          String(x.id) === String(sale.productId)
      );


    /* Delete sale */

    await removeItem(
      "sales",
      id
    );


    /* Restore stock */

    if (product) {

      product.stock =
        safeNumber(product.stock) +
        safeNumber(sale.qty);


      await saveItem(
        "products",
        product
      );

    }


    /* Remove related due */

    const relatedDue =
      duePayments.filter(
        d =>
          String(d.saleId || "") ===
          String(id)
      );


    for (const due of relatedDue) {

      await removeItem(
        "duePayments",
        due.id
      );

    }


    /* Local */

    sales =
      sales.filter(
        x =>
          String(x.id) !== String(id)
      );


    duePayments =
      duePayments.filter(
        d =>
          String(d.saleId || "") !==
          String(id)
      );


    renderAll();

    toast("Sale deleted এবং stock restore হয়েছে");

  } catch (error) {

    toast(
      firebaseErrorMessage(
        error,
        "Sale delete করা যায়নি।"
      )
    );

  }

};

/* =====================================================
   DELETE PURCHASE + REDUCE STOCK
===================================================== */

window.deletePurchase = async function (id) {

  if (!confirm("Purchase delete করবেন?")) {
    return;
  }


  try {

    const purchase =
      purchases.find(
        x =>
          String(x.id) === String(id)
      );


    if (!purchase) {

      toast("Purchase পাওয়া যায়নি");
      return;

    }


    const product =
      products.find(
        x =>
          String(x.id) ===
          String(purchase.productId)
      );


    if (product) {

      const currentStock =
        safeNumber(product.stock);

      const purchaseQty =
        safeNumber(purchase.qty);


      if (currentStock < purchaseQty) {

        toast(
          "এই Purchase delete করলে stock negative হবে। আগে stock check করুন।"
        );

        return;

      }


      product.stock =
        currentStock - purchaseQty;


      await saveItem(
        "products",
        product
      );

    }


    await removeItem(
      "purchases",
      id
    );


    purchases =
      purchases.filter(
        x =>
          String(x.id) !== String(id)
      );


    renderAll();

    toast("Purchase deleted এবং stock update হয়েছে");

  } catch (error) {

    toast(
      firebaseErrorMessage(
        error,
        "Purchase delete করা যায়নি।"
      )
    );

  }

};


/* =====================================================

window.addDue = async function () {

    );

    toast("Due added");

  } catch (error) {

/* =====================================================
   MONEY
===================================================== */

function money(n) {

  return "৳" +
    safeNumber(n)
      .toLocaleString("en-BD");

}


/* =====================================================
   DATE
===================================================== */

function dateFormat(d) {

  if (!d) {
    return "";
  }

  const date =
    new Date(d);

  if (Number.isNaN(date.getTime())) {
    return "";
  }

  return date.toLocaleDateString("bn-BD");

}

    );


  const totalPurchase =
    purchases.reduce(
      (a, b) =>

    );


  const totalExpense =
    expenses.reduce(
      (a, b) =>
        a + safeNumber(b.amount),
      0
    );


  const totalDue =
    duePayments.reduce(
      (a, b) =>
        a + safeNumber(b.amount),
      0
    );


  const setText = (id, value) => {

    const el =
      document.getElementById(id);

    if (el) {
      el.innerText = value;
    }

  };


  setText(
    "totalSales",
    money(totalSales)
  );

  setText(
    "totalPurchase",
    money(totalPurchase)
  );

  setText(
    "totalExpense",
    money(totalExpense)
  );

  setText(
    "totalDue",
    money(totalDue)
  );

  setText(
    "totalProducts",
    products.length

    "reportSales",
    money(totalSales)

/* =====================================================
   ACCOUNT DELETE
===================================================== */

window.deleteAccount = async function () {

  if (
    !confirm(
      "Account permanently delete করবেন?\n\nসব Products, Sales, Purchase, Due ও Expense মুছে যাবে।"
    )
  ) {
    return;
  }


  try {

    const currentUser =
      auth.currentUser;


    if (!currentUser) {

      toast("Login করুন");
      return;

    }


    const uidValue =
      currentUser.uid;


    const collections = [
      "products",
      "sales",
      "purchases",
      "expenses",
      "duePayments"
    ];


    /*
      Delete collection documents
      in batches of maximum 500.
    */

    for (const collectionName of collections) {

      const snap =
        await getDocs(
          collection(
            db,
            "users",
            uidValue,
            collectionName
          )
        );


      let batch =
        writeBatch(db);

      let count = 0;


      for (const item of snap.docs) {

        batch.delete(item.ref);

        count++;


        if (count === 500) {

          await batch.commit();

          batch =
            writeBatch(db);

          count = 0;

        }

      }


      if (count > 0) {

        await batch.commit();

      }

    }


    /* Settings */

    await deleteDoc(
      doc(
        db,
        "users",
        uidValue,
        "settings",
        "main"
      )
    ).catch(() => {});


    /* User document */

    await deleteDoc(
      doc(
        db,
        "users",
        uidValue
      )
    );


    /*
      Firebase may require recent login
      for account deletion.
    */

    await deleteUser(
      currentUser
    );


    products = [];
    sales = [];
    purchases = [];
    expenses = [];
    duePayments = [];


    toast(
      "Account permanently deleted"
    );

  } catch (error) {

    toast(
      firebaseErrorMessage(
        error,
        "Account delete করা যায়নি।"
      )
    );

  }

};


/* =====================================================
   BACKUP
===================================================== */

window.downloadBackup = function () {

  try {

    const data = {

      version: 1,
      exportedAt:
        new Date().toISOString(),

      settings,
      products,
      sales,
      purchases,
      expenses,
      duePayments

    };


    const blob =
      new Blob(
        [
          JSON.stringify(
            data,
            null,
            2
          )
        ],
        {
          type: "application/json"
        }
      );


    const url =
      URL.createObjectURL(blob);


    const a =
      document.createElement("a");


    a.href = url;


    a.download =
      "smart-store-backup-" +
      Date.now() +
      ".json";


    document.body.appendChild(a);

    a.click();

    a.remove();


    setTimeout(() => {
      URL.revokeObjectURL(url);
    }, 1000);


    toast("Backup downloaded");

  } catch (error) {

    toast(
      "Backup তৈরি করা যায়নি।"
    );

  }

};

        writeBatch(db);

      count = 0;

    }

  }


  if (count > 0) {
    await batch.commit();
  }

}


/* =====================================================
   RESTORE
===================================================== */

window.restoreBackup = async function (event) {

  const file =
    event?.target?.files?.[0];


  if (!file) {
    return;
  }


  if (
    !confirm(
      "Restore করলে বর্তমান data replace হবে। Continue?"
    )
  ) {

    event.target.value = "";
    return;

  }


  try {

    if (!auth.currentUser) {
      throw new Error("আগে Login করুন।");
    }


    const text =
      await file.text();


    let data;


    try {

      data =
        JSON.parse(text);

    } catch (_) {

      throw new Error(
        "Backup fileটি valid JSON নয়।"
      );

    }


    if (
      !data ||
      typeof data !== "object"
    ) {

      throw new Error(
        "Backup file format সঠিক নয়।"
      );

    }


    const collections = [
      "products",
      "sales",
      "purchases",
      "expenses",
      "duePayments"
    ];


    /*
      Validate arrays
    */

    for (const name of collections) {

      if (
        data[name] !== undefined &&
        !Array.isArray(data[name])
      ) {

        throw new Error(
          `${name} data সঠিক নয়।`
        );

      }

    }


    /*
      Clear old data
    */

    for (const collectionName of collections) {

      await clearUserCollection(
        collectionName
      );

    }


    /*
      Restore new data
    */

    for (const collectionName of collections) {

      const items =
        Array.isArray(data[collectionName])
          ? data[collectionName]
          : [];


      let batch =
        writeBatch(db);

      let count = 0;


      for (const item of items) {

        if (
          !item ||
          !item.id
        ) {
          continue;
        }


        batch.set(
          userDoc(
            collectionName,
            item.id
          ),
          item
        );


        count++;


        if (count === 500) {

          await batch.commit();

          batch =
            writeBatch(db);

          count = 0;

        }

      }


      if (count > 0) {

        await batch.commit();

      }

    }


    /*
      Restore settings
    */

    if (
      data.settings &&
      typeof data.settings === "object"
    ) {

      settings = {

        storeName:
          String(
            data.settings.storeName ||
            "Smart Store"
          )

      };

    } else {

      settings = {
        storeName: "Smart Store"
      };

    }


    await setDoc(
      doc(
        db,
        "users",
        uid(),
        "settings",
        "main"
      ),
      settings
    );


    /*
      Reload everything
    */

    await loadAll();


    event.target.value = "";


    toast(
      "Backup restored successfully"
    );

  } catch (error) {

    if (event?.target) {
      event.target.value = "";
    }


    toast(
      "Backup restore failed: " +
      firebaseErrorMessage(
        error,
        "Restore করা যায়নি।"
      )
    );

  }

};
